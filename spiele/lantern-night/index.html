<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lantern Night</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Halte deine Laterne bis zum Morgengrauen am Brennen – ein Survivors-Spiel im nächtlichen Wald.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700;800&family=Barlow+Semi+Condensed:wght@500;700&family=Grenze+Gotisch:wght@600;800&display=swap">
<style>
/* Vollbild-Nachtwald auf dem Canvas; Menü als Titelkarte unten links, Dialoge mittig über der abgedunkelten Szene */
:root {
  --night: #0a0e1b;
  --ink: #efe6cf;
  --ink-dim: #a8a190;
  --amber: #ffb84d;
  --ember: #ff6a4a;
  --moon: #9fd0ff;
  --lilac: #b99cff;
  --line: rgba(255, 184, 77, .32);
  --panel: rgba(13, 17, 31, .92);
  --f-display: "Grenze Gotisch", "Palatino Linotype", Georgia, serif;
  --f-body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-num: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; background: var(--night); color: var(--ink); }
body { font-family: var(--f-body); font-size: 16px; line-height: 1.4; -webkit-tap-highlight-color: transparent; }
#game { position: fixed; inset: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* Bildschirme */
.screen {
  position: absolute; inset: 0; display: flex; overflow-y: auto;
  padding-top: max(20px, env(safe-area-inset-top, 0px));
  padding-bottom: max(20px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.screen.dim { background: rgba(4, 6, 14, .68); }
#menu { align-items: flex-end; background: linear-gradient(90deg, rgba(4, 6, 14, .85) 0%, rgba(4, 6, 14, .4) 42%, rgba(4, 6, 14, 0) 68%); }
@media (max-width: 760px) {
  #menu { background: linear-gradient(0deg, rgba(4, 6, 14, .94) 0%, rgba(4, 6, 14, .6) 52%, rgba(4, 6, 14, 0) 78%); }
}
.title-card { width: min(31rem, 100%); display: flex; flex-direction: column; gap: 16px; margin-left: clamp(0px, 5vw, 72px); margin-bottom: clamp(0px, 5vh, 56px); }
.eyebrow { margin: 0; font-family: var(--f-num); font-weight: 700; font-size: .82rem; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); }
h1 {
  margin: 0; font-family: var(--f-display); font-weight: 800; font-size: clamp(3.6rem, 12vw, 7.4rem); line-height: .82;
  color: var(--amber); text-shadow: 0 0 28px rgba(255, 168, 60, .5), 0 0 2px rgba(255, 220, 160, .6); text-wrap: balance;
}
h2 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: clamp(2.1rem, 6vw, 3.1rem); line-height: .95; text-wrap: balance; }
.tag { margin: 0; font-size: 1.15rem; max-width: 26em; }
.menu-btns, .row { display: flex; flex-wrap: wrap; gap: 10px; }
.col { display: flex; flex-direction: column; gap: 10px; }
.menu-meta { display: flex; flex-wrap: wrap; gap: 6px 20px; font-family: var(--f-num); font-size: 1.02rem; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.menu-meta b { color: var(--ink); font-weight: 700; }
.menu-meta .amb { display: inline-flex; align-items: center; gap: 5px; color: var(--amber); font-weight: 700; }
.menu-meta svg { width: 16px; height: 16px; }
.hint { margin: 0; font-size: .92rem; color: var(--ink-dim); max-width: 30em; }

/* Knöpfe */
.btn {
  appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 20px;
  border: 1px solid var(--line); border-radius: 6px; background: rgba(21, 27, 46, .8); color: var(--ink);
  font: 700 1.05rem/1.1 var(--f-body); letter-spacing: .01em; cursor: pointer; transition: border-color .15s, background-color .15s, box-shadow .15s;
}
.btn:hover { border-color: var(--amber); background: rgba(40, 37, 46, .92); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .42; cursor: default; transform: none; border-color: var(--line); background: rgba(21, 27, 46, .8); }
.btn.primary { background: var(--amber); border-color: var(--amber); color: #1d1405; box-shadow: 0 0 24px rgba(255, 184, 77, .35); }
.btn.primary:hover { background: #ffc872; }
.btn.small { min-height: 38px; padding: 6px 14px; font-size: .95rem; font-weight: 500; }
.btn svg { width: 18px; height: 18px; }
:focus-visible { outline: 2px solid var(--moon); outline-offset: 3px; }
.ico .f { fill: currentColor; }
.ico .s { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ico .k { fill: #0b1020; }

/* Tafeln */
.panel { width: min(760px, 100%); margin: auto; display: flex; flex-direction: column; gap: 16px; padding: 24px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); box-shadow: 0 20px 60px rgba(0, 0, 0, .5); }
.panel.narrow { width: min(360px, 100%); }
.sub { margin: 0; color: var(--ink-dim); max-width: 60ch; }

/* Stufenaufstieg */
.lv-wrap { width: min(1000px, 100%); margin: auto; display: flex; flex-direction: column; gap: 14px; }
.lv-head { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 6px 16px; }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.cards.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 1000px) { .cards.four { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 760px) { .cards, .cards.four { grid-template-columns: minmax(0, 1fr); } }
.card {
  position: relative; display: flex; gap: 14px; align-items: flex-start; min-height: 128px; padding: 18px 16px; text-align: left;
  border: 1px solid var(--line); border-radius: 8px; background: linear-gradient(180deg, rgba(30, 32, 52, .97), rgba(14, 18, 32, .97));
  color: var(--ink); font: inherit; cursor: pointer; transition: border-color .15s, box-shadow .15s; animation: cardIn .28s ease-out both;
}
.card:nth-child(2) { animation-delay: .05s; }
.card:nth-child(3) { animation-delay: .1s; }
.card:nth-child(4) { animation-delay: .15s; }
@keyframes cardIn { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
.card:hover, .card:focus-visible { border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber), 0 0 32px rgba(255, 184, 77, .22); }
.card.locked { pointer-events: none; }
.card > .ico { flex: none; width: 46px; height: 46px; padding: 9px; border-radius: 50%; background: rgba(255, 184, 77, .13); color: var(--amber); }
.card.pas > .ico { background: rgba(159, 208, 255, .13); color: var(--moon); }
.c-body { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.c-name { font-weight: 800; font-size: 1.18rem; }
.c-lv { font-family: var(--f-num); font-size: .9rem; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.c-new { align-self: flex-start; font-family: var(--f-num); font-weight: 700; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; padding: 1px 7px; border-radius: 3px; background: var(--moon); color: var(--night); }
.c-desc { margin-top: 4px; line-height: 1.35; }
.card kbd { position: absolute; top: 10px; right: 12px; font-family: var(--f-num); font-size: .8rem; color: var(--ink-dim); border: 1px solid rgba(239, 230, 207, .22); border-radius: 4px; padding: 0 6px; }
@media (hover: none) { .card kbd { display: none; } }

/* Werkstatt: Sternkarte mit vier Pfaden */
#shop .panel { width: min(1160px, 100%); gap: 14px; }
.shop-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px 16px; }
.shop-meta { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 18px; }
.lit { font-family: var(--f-num); color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.purse { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-num); font-weight: 700; font-size: 1.5rem; color: var(--amber); font-variant-numeric: tabular-nums; }
.purse svg { width: 22px; height: 22px; }
.tree-wrap {
  position: relative; height: clamp(300px, 54vh, 830px); overflow: auto; overscroll-behavior: contain; touch-action: pan-x pan-y; cursor: grab;
  border: 1px solid rgba(239, 230, 207, .12); border-radius: 8px; background: radial-gradient(ellipse at 50% 50%, #131b35 0%, #070a14 75%);
}
.tree-wrap.dragging { cursor: grabbing; }
.tree {
  position: relative; margin-inline: auto;
  background-image:
    radial-gradient(1.2px 1.2px at 23px 41px, rgba(255, 255, 255, .55), transparent),
    radial-gradient(1px 1px at 97px 13px, rgba(255, 255, 255, .35), transparent),
    radial-gradient(1.4px 1.4px at 151px 88px, rgba(200, 220, 255, .5), transparent),
    radial-gradient(1px 1px at 61px 127px, rgba(255, 255, 255, .3), transparent),
    radial-gradient(1px 1px at 183px 151px, rgba(255, 230, 190, .4), transparent);
  background-size: 200px 170px;
}
.tree svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.tree line { stroke: var(--c); stroke-width: 2; stroke-linecap: round; opacity: .16; }
.tree line.avail { opacity: .5; stroke-dasharray: 4 6; }
.tree line.own { opacity: .9; stroke-width: 3; }
.br-label { position: absolute; font-family: var(--f-display); font-weight: 800; font-size: 1.7rem; color: var(--c); opacity: .85; pointer-events: none; transform: translateY(-50%); text-shadow: 0 0 18px #000; }
.node {
  position: absolute; width: var(--ns); height: var(--ns); transform: translate(-50%, -50%); padding: 0; display: grid; place-items: center;
  border: 2px solid var(--c); border-radius: 50%; background: #0b1020; color: var(--c); cursor: pointer; transition: box-shadow .15s, background-color .15s;
}
.node.act { border-radius: 30%; }
.node > .ico { width: 55%; height: 55%; }
.node.locked { opacity: .36; border-style: dashed; }
.node.avail { box-shadow: 0 0 16px -3px var(--c); }
.node.part { background: color-mix(in srgb, var(--c) 30%, #0b1020); }
.node.max { background: var(--c); color: #120d05; box-shadow: 0 0 20px -2px var(--c); }
.node.root { border-width: 3px; }
.node:hover { box-shadow: 0 0 0 3px rgba(255, 255, 255, .12), 0 0 22px -2px var(--c); }
.node.sel { outline: 2px solid var(--ink); outline-offset: 4px; }
.node b { position: absolute; right: -9px; bottom: -6px; min-width: 26px; padding: 0 4px; border-radius: 8px; border: 1px solid var(--c); background: #0b1020; color: var(--ink); font: 700 .68rem/14px var(--f-num); font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: no-preference) {
  .node.avail { animation: nodeGlow 2.4s ease-in-out infinite; }
  @keyframes nodeGlow { 50% { box-shadow: 0 0 26px -1px var(--c); } }
}
.node-info { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 14px; padding: 14px; border-radius: 8px; border-left: 3px solid var(--c); background: rgba(255, 255, 255, .04); }
.node-info > .ico { width: 46px; height: 46px; padding: 10px; border-radius: 50%; background: rgba(255, 255, 255, .06); color: var(--c); }
.ni-body { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.ni-body h3 { margin: 0; font-size: 1.15rem; }
.ni-body p { margin: 0; max-width: 62ch; }
.ni-tag { font-family: var(--f-num); font-weight: 700; font-size: .76rem; letter-spacing: .1em; text-transform: uppercase; color: var(--c); }
.ni-need { color: var(--ink-dim); font-size: .92rem; }
@media (max-width: 600px) { .node-info { grid-template-columns: auto minmax(0, 1fr); } .node-info > :last-child:not(.ni-body) { grid-column: 1 / -1; } }
.pips { display: flex; gap: 4px; margin-top: 3px; }
.pips i { width: 14px; height: 4px; border-radius: 2px; background: rgba(239, 230, 207, .18); }
.pips i.on { background: var(--c, var(--amber)); }
.pips i.gl { background: rgba(255, 241, 168, .16); }
.pips i.gl.on { background: #fff1a8; box-shadow: 0 0 6px rgba(255, 241, 168, .8); }
.ni-glanz { margin: 0; font-size: .9rem; color: #fff1a8; }
.buy { flex: none; min-width: 120px; font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.buy svg { color: #1d1405; }
.shop-foot { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 0; font-size: .9rem; color: var(--ink-dim); }
.legend > span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { width: 14px; height: 14px; border: 2px solid var(--ink-dim); border-radius: 50%; }
.legend i.sq { border-radius: 30%; }

/* Gabenliste (Prioritäten) */
#prioScr .panel { width: min(480px, 100%); }
.prio { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.pr { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 6px; border: 1px solid rgba(239, 230, 207, .1); background: rgba(255, 255, 255, .03); }
.pr.in { border-color: rgba(255, 159, 208, .5); background: rgba(255, 159, 208, .08); }
.pr .pn { width: 22px; text-align: center; font: 700 1rem var(--f-num); color: #ff9fd0; font-variant-numeric: tabular-nums; }
.pr:not(.in) .pn { color: var(--ink-dim); }
.pr > .ico { flex: none; width: 22px; height: 22px; color: var(--amber); }
.pr.pas > .ico { color: var(--moon); }
.pr .pname { flex: 1; min-width: 0; font-weight: 700; }
.pr:not(.in) .pname { font-weight: 500; color: var(--ink-dim); }
.btn.mv { min-width: 38px; min-height: 34px; padding: 4px 8px; }
.pr-cut { padding-top: 6px; margin-top: 2px; border-top: 1px dashed rgba(239, 230, 207, .25); text-align: center; font: 700 .74rem var(--f-num); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-dim); }
.ni-act { display: flex; flex-direction: column; gap: 8px; max-width: 300px; }
.card.autosel { border-color: var(--moon); box-shadow: 0 0 0 2px var(--moon), 0 0 30px rgba(159, 208, 255, .3); }
.card.autosel::after { content: 'AUTO'; position: absolute; top: 10px; right: 42px; font: 700 .72rem/1.4 var(--f-num); letter-spacing: .1em; color: var(--moon); }

/* Spielstände */
.slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .slots { grid-template-columns: minmax(0, 1fr); } }
.slot { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 8px; border: 1px solid rgba(239, 230, 207, .14); background: rgba(255, 255, 255, .03); min-width: 0; }
.slot.cur { border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber) inset; }
.slot-name { width: 100%; min-width: 0; padding: 6px 8px; border: 1px solid transparent; border-radius: 5px; background: transparent; color: var(--ink); font: 800 1.15rem var(--f-body); }
.slot-name:hover, .slot-name:focus { border-color: var(--line); background: rgba(0, 0, 0, .25); }
.slot-stats { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 0; font-family: var(--f-num); color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.slot-stats b { color: var(--ink); }
.slot-night { margin: 0; font-size: .92rem; color: var(--moon); }
.slot-empty { margin: 0; color: var(--ink-dim); }
.transfer { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .transfer { grid-template-columns: minmax(0, 1fr); } }
.transfer > div { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.transfer h3 { margin: 0; font-size: 1rem; }
.transfer p { margin: 0; font-size: .9rem; color: var(--ink-dim); }
.code { width: 100%; min-height: 64px; resize: vertical; padding: 8px; border-radius: 6px; border: 1px solid rgba(239, 230, 207, .18); background: rgba(0, 0, 0, .3); color: var(--ink); font: .8rem/1.35 ui-monospace, Consolas, monospace; word-break: break-all; user-select: text; -webkit-user-select: text; }
.note { margin: 0; min-height: 1.3em; font-size: .92rem; color: var(--moon); }
.note.bad { color: var(--ember); }
.picks { display: flex; flex-wrap: wrap; gap: 8px; }
.pick { flex-direction: column; align-items: flex-start; gap: 0; min-height: 50px; padding: 6px 14px; text-align: left; }
.pick span { font: 700 .7rem/1.2 var(--f-num); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-dim); }
.pick b { font-weight: 800; font-size: 1rem; }
.menu-meta .shd, .stat.shd svg, .purse.shard { color: var(--moon); }
.menu-meta .shd, .menu-meta .apv { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; }
.menu-meta .apv, .purse.ap, .earn.ap, .chips .apc svg { color: #ff8a5c; }

/* Welten und Begleiter */
.titan-loot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 12px 0 0; color: #ff8a5c; font-weight: 600; }
.titan-loot svg { width: 18px; height: 18px; }
.cards2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.cards4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 900px) { .cards4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 600px) { .cards2, .cards4 { grid-template-columns: minmax(0, 1fr); } }
.wcard { display: flex; flex-direction: column; gap: 8px; min-width: 0; padding: 12px; border-radius: 8px; border: 1px solid rgba(239, 230, 207, .14); background: rgba(255, 255, 255, .03); }
.wcard.cur { border-color: var(--c, var(--amber)); box-shadow: 0 0 0 1px var(--c, var(--amber)) inset; }
.wcard.locked { opacity: .55; }
.wcard.wide { grid-column: 1 / -1; }
.swatch { position: relative; height: 70px; border-radius: 6px; display: grid; place-items: center; color: var(--c); overflow: hidden; }
.swatch .ico { width: 34px; height: 34px; filter: drop-shadow(0 0 8px var(--c)); }
.wcard h3 { margin: 0; font-size: 1.15rem; }
.wcard p { margin: 0; font-size: .92rem; color: var(--ink-dim); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chips span { padding: 2px 8px; border-radius: 4px; background: rgba(255, 255, 255, .06); font: 700 .78rem/1.5 var(--f-num); color: var(--ink); font-variant-numeric: tabular-nums; }
.chips svg { width: 12px; height: 12px; vertical-align: -1px; color: var(--moon); }
.comp-head { display: flex; align-items: center; gap: 12px; }
.comp-ico { flex: none; display: grid; place-items: center; width: 60px; height: 60px; border-radius: 50%; background: rgba(255, 255, 255, .06); color: var(--c); }
.comp-ico .ico { width: 34px; height: 34px; }
.wcard .ni-tag { margin: 0; text-transform: none; letter-spacing: .02em; font-size: .88rem; }
.wcard .buy svg { width: 16px; height: 16px; color: #1d1405; }
.slot-stats .shd svg { color: var(--moon); }
.wcard .row { margin-top: auto; }
.btn.on { border-color: var(--moon); color: var(--moon); }
#slotsScr .panel { width: min(1000px, 100%); }
.slot-name { user-select: text; -webkit-user-select: text; }
p.slot-name { margin: 0; padding-left: 0; }
.slot-stats svg { width: 14px; height: 14px; margin-right: 3px; vertical-align: -2px; color: var(--amber); }

/* Fähigkeiten im Spiel */
#abil { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: flex-end; gap: 12px; }
.ab { position: relative; width: 58px; height: 58px; padding: 0; display: grid; place-items: center; overflow: hidden; border: 2px solid var(--c); border-radius: 30%; background: rgba(8, 11, 22, .82); color: var(--c); pointer-events: auto; cursor: pointer; }
.ab > .ico { width: 28px; height: 28px; }
.ab .cd { position: absolute; inset: 0; background: conic-gradient(rgba(4, 6, 14, .8) calc(var(--p, 0) * 360deg), transparent 0); pointer-events: none; }
.ab.ready { box-shadow: 0 0 18px -4px var(--c); }
.ab kbd { position: absolute; left: 0; right: 0; bottom: 3px; text-align: center; font: 700 .62rem/1 var(--f-num); letter-spacing: .04em; color: var(--ink); text-shadow: 0 1px 3px #000; }
span.ab { cursor: default; }
.ab.auto::after { content: attr(data-auto); position: absolute; top: 3px; left: 0; right: 0; text-align: center; font: 700 .52rem/1 var(--f-num); letter-spacing: .1em; color: var(--c); text-shadow: 0 1px 3px #000; }
@media (hover: none) { .ab { width: 62px; height: 62px; } .ab kbd.key { display: none; } }
@media (max-width: 420px) { #abil { gap: 8px; } .ab { width: 54px; height: 54px; } }
#slowTint { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 40%, rgba(120, 150, 255, .22)); opacity: 0; transition: opacity .3s; }
#slowTint.on { opacity: 1; }
#toast { position: absolute; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); padding: 8px 16px; border-radius: 6px; background: rgba(13, 17, 31, .95); border: 1px solid var(--line); font-weight: 700; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 5; }
#toast.show { opacity: 1; }

/* Ende einer Nacht */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 0; }
.stats div { padding: 12px; border-radius: 8px; background: rgba(255, 255, 255, .04); min-width: 0; }
.stats dt { font-family: var(--f-num); font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim); }
.stats dd { margin: 2px 0 0; font-family: var(--f-num); font-weight: 700; font-size: 1.8rem; font-variant-numeric: tabular-nums; }
@media (max-width: 520px) {
  .stats { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .stats div { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 8px 12px; }
  .stats dd { margin: 0; font-size: 1.4rem; }
}
.earn { margin: 0; display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; font-family: var(--f-num); font-weight: 700; font-size: 1.5rem; color: var(--amber); }
.earn svg { width: 22px; height: 22px; }
.earn small { font-size: .95rem; font-weight: 500; color: var(--ink-dim); }
.rec { color: var(--moon); }

/* Anzeige im Spiel */
#hud { position: absolute; inset: 0; pointer-events: none; }
.xp { position: absolute; left: 0; right: 0; top: 0; height: calc(6px + env(safe-area-inset-top, 0px)); background: rgba(4, 6, 14, .65); }
.xp i { position: absolute; left: 0; bottom: 0; height: 6px; width: 0; background: linear-gradient(90deg, #6aa8ff, var(--moon)); box-shadow: 0 0 10px var(--moon); }
.hud-top {
  position: absolute; top: calc(14px + env(safe-area-inset-top, 0px));
  left: max(14px, env(safe-area-inset-left, 0px)); right: max(14px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: start; gap: 10px;
}
.hp { position: relative; width: min(220px, 100%); height: 18px; border-radius: 4px; background: rgba(4, 6, 14, .72); border: 1px solid rgba(255, 106, 74, .5); overflow: hidden; }
.hp i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: linear-gradient(90deg, #b8392a, var(--ember)); }
#hpTxt { position: relative; display: block; padding-left: 7px; font-family: var(--f-num); font-weight: 700; font-size: .8rem; line-height: 16px; font-variant-numeric: tabular-nums; }
.lvl { margin-top: 6px; font-family: var(--f-num); font-weight: 700; font-size: .95rem; color: var(--moon); text-shadow: 0 1px 6px rgba(0, 0, 0, .8); }
.inv { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; max-width: 250px; }
.inv span { position: relative; width: 26px; height: 26px; border-radius: 5px; background: rgba(4, 6, 14, .66); display: grid; place-items: center; color: var(--amber); }
.inv span.p { color: var(--moon); }
.inv svg { width: 16px; height: 16px; }
.inv b { position: absolute; right: -3px; bottom: -5px; font-family: var(--f-num); font-size: .66rem; color: var(--ink); }
.hud-mid { display: flex; flex-direction: column; align-items: center; gap: 4px; }
#clock { font-family: var(--f-num); font-weight: 700; font-size: 1.7rem; line-height: 1; letter-spacing: .04em; font-variant-numeric: tabular-nums; text-shadow: 0 1px 10px rgba(0, 0, 0, .9); }
#remain { font-family: var(--f-num); font-weight: 700; font-size: .85rem; color: var(--ink-dim); font-variant-numeric: tabular-nums; text-shadow: 0 1px 6px #000; }
#remain.soon { color: var(--amber); }
#boss { display: flex; flex-direction: column; align-items: center; gap: 3px; font-family: var(--f-display); font-size: 1.1rem; color: #dccdff; text-shadow: 0 1px 6px #000; }
.bossbar { width: min(340px, 52vw); height: 8px; border-radius: 3px; background: rgba(4, 6, 14, .72); border: 1px solid rgba(185, 156, 255, .55); overflow: hidden; }
.bossbar i { display: block; height: 100%; width: 100%; background: var(--lilac); }
.hud-right { justify-self: end; display: flex; align-items: center; gap: 12px; font-family: var(--f-num); font-weight: 700; font-size: 1.1rem; font-variant-numeric: tabular-nums; text-shadow: 0 1px 6px rgba(0, 0, 0, .9); }
.stat { display: inline-flex; align-items: center; gap: 5px; }
.stat svg { width: 18px; height: 18px; }
.stat.kills svg { color: #ff7c95; }
.stat.amb svg { color: var(--amber); }
.stat.apv svg { color: #ff8a5c; }
.farm { display: flex; flex-direction: column; gap: 6px; }

.seg .btn[aria-pressed="true"].apv { border-color: #ff8a5c; color: #ff8a5c; box-shadow: 0 0 0 1px #ff8a5c inset; }
#pauseBtn { pointer-events: auto; width: 42px; min-height: 42px; padding: 0; }
@media (max-width: 520px) {
  .stat.kills { display: none; }
  #clock { font-size: 1.35rem; }
  .bossbar { width: 34vw; }
  .inv span { width: 22px; height: 22px; }
  .inv svg { width: 14px; height: 14px; }
}
#banner {
  position: absolute; left: 0; right: 0; top: 28%; padding-left: 16px; padding-right: 16px; text-align: center;
  font-family: var(--f-display); font-weight: 800; font-size: clamp(1.8rem, 6vw, 3rem); color: var(--amber);
  text-shadow: 0 0 22px rgba(255, 168, 60, .55), 0 2px 8px #000; opacity: 0; transition: opacity .4s;
}
#banner.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) {
  .card { animation: none; }
  #banner { transition: none; }

    };
    if (U('fStart')) run.items.spark = Math.min(ITEMS.spark.max, 1 + U('fStart'));
    setWorld(save.world);
    run.endless = !!curWorld.endless;
    if (run.endless) setTimeout(() => toast(T(save.arenaConvert ? 'convStart' : 'farmAmberStart')), 600);
    run.nextBoss = Math.max(120, 180 - 30 * U('arenaRush'));
    // Arena „Aufwärmen“: gleich auf Stufe 5, die vier Gaben werden sofort gewählt

    // Begleiter mitnehmen

    run.pets = sel.map((id, i) => ({ id, x: -20 - i * 16, y: 12, vx: 0, t: 1, anim: Math.random() * 5, face: 1, a: i * Math.PI, tg: null }));

  function edgePoint(a = Math.random() * TAU) {

  function pickType(t) {

    if (t < 150) return r < 0.5 ? 'shade' : r < 0.78 ? 'moth' : 'crow';
    if (t < 220) return r < 0.45 ? 'shade' : r < 0.7 ? 'moth' : r < 0.87 ? 'crow' : 'rootling';
    return r < 0.38 ? 'shade' : r < 0.6 ? 'moth' : r < 0.74 ? 'crow' : r < 0.88 ? 'rootling' : 'spitter';
  }
  function spawnEnemy(type, x, y) {
    const d = EN[type], hp = d.hp * curWorld.hp * (1 + run.t / 170 + (run.t / 320) ** 2);
    const e = { type, d, x, y, kx: 0, ky: 0, hp, max: hp, r: d.r, face: 1, fl: 0, oc: 0, anim: Math.random() * 10, ph: Math.random() * TAU, st: 0, tm: rand(1, 3), t2: 6, ax: 0, ay: 0, dead: false };
    enemies.push(e);

  function spawnTick(dt) {
    const t = run.t;

    if (t >= run.nextWave) {
      // Schwarm der Welt: Motten, Geister, Wölfe oder Fledermäuse

      const sw = curWorld.swarm === 'any' ? SWARMS[(Math.random() * SWARMS.length) | 0] : curWorld.swarm;
      const n = Math.round(14 + t / 15), a0 = Math.random() * TAU;

    }
    if (run.endless && save.titan.on) titanTick(dt);

  }
  // jede Welt hat ihren Boss; in der Arena kommen sie reihum und werden jedes Mal stärker
  function spawnBoss() {
    run.bossN++;
    const type = curWorld.boss === 'rotate' ? BOSSES[(run.bossN - 1) % BOSSES.length] : curWorld.boss;
    const base = run.endless ? 1500 * (1 + 0.7 * (run.bossN - 1)) : run.bossN === 1 ? 1500 : 4200;
    let e = null;
    for (let i = 0; i <= B('boss'); i++) {
      const [x, y] = edgePoint();
      const b = spawnEnemy(type, x, y);
      b.hp = b.max = base * curWorld.hp;

    }
    run.boss = e;
    if (run.endless) run.nextBoss += Math.max(120, 180 - 30 * U('arenaRush'));
    banner(tf('bossWarnN', { n: e.d.name[lang] })); Snd.play('boss'); shake(4);
  }

  // ---------- Arena-Titan: eigener Boss mit Reglern, Beute wächst mit ----------
  const TITAN_KEYS = ['dmg', 'spd', 'rsp', 'hp'];
  const titanDmg = lv => 1 + 0.2 * lv;
  const titanSpd = lv => 1 + 3 * (1 - 0.96 ** lv);   // nähert sich 4-fachem Tempo
  const titanResp = lv => 10 + 140 * 0.9 ** lv;        // Sekunden bis zur Wiederkehr
  const titanHp = lv => Math.round(2500 * (1 + 0.35 * lv) * (WORLDS.find(w => w.endless).hp));
  function titanReward() {
    const t = save.titan, n = t.dmg + t.spd + t.hp;   // Wiederkehr bringt mehr Kämpfe statt mehr Beute
    return { amber: Math.round(20 * (1 + 0.25 * n)), shards: 2 + Math.floor(n / 3), ap: 5 + 2 * n };
  }
  function titanize(e) { const t = save.titan; e.titan = true; e.dmgMul = titanDmg(t.dmg); e.spMul = titanSpd(t.spd); }
  function titanTick(dt) {

  function titanLoot(e) {
    const rw = titanReward(), rolls = 1 + B('loot');

    const amber = rw.amber * rolls, shards = rw.shards * rolls, n = Math.min(12, amber), ns = Math.min(8, shards);
    for (let i = 0; i < n; i++) addLoot('amber', e.x + rand(-55, 55), e.y + rand(-40, 40), Math.floor(amber / n) + (i < amber % n ? 1 : 0));
    for (let i = 0; i < ns; i++) addLoot('shard', e.x + rand(-40, 40), e.y + rand(-34, 34), Math.floor(shards / ns) + (i < shards % ns ? 1 : 0));
    addLoot('berry', e.x, e.y + 26); addLoot('amberheart', e.x, e.y - 26);
    banner(tf('titanDown', { p: rw.ap * rolls }), 1.8);
    shake(10); flashes.push({ x: e.x, y: e.y, r: 360, life: 0.55, max: 0.55 }); Snd.play('win');
  }

  function updatePlayer(dt) {
    let ix = 0, iy = 0;
    if (keys.a || keys.arrowleft) ix -= 1;
    if (keys.d || keys.arrowright) ix += 1;
    if (keys.w || keys.arrowup) iy -= 1;
    if (keys.s || keys.arrowdown) iy += 1;
    const pad = padInput();
    if (pad) { ix = pad[0]; iy = pad[1]; }
    if (joy.active && (joy.dx || joy.dy)) { ix = joy.dx; iy = joy.dy; }
    if (dbg.input) { ix = dbg.input.x; iy = dbg.input.y; }
    const m = Math.hypot(ix, iy);
    if (m > 1) { ix /= m; iy /= m; }
    if (m > 0.1) { const k = Math.hypot(ix, iy); P.dx = ix / k; P.dy = iy / k; }
    if (P.dashT > 0) {
      // Lichtsprung: schnell in Laufrichtung, mit Lichtspur
      const ds = 760 * (U('featherweight') ? 1.3 : 1);
      P.dashT -= dt;
      P.x += P.dx * ds * dt; P.y += P.dy * ds * dt;
      if (parts.length < 800) parts.push({ x: P.x, y: P.y - 2, vx: 0, vy: 0, life: 0.3, max: 0.3, r: 4, g: 'moon' });
    } else {
      const sp = P.speed * (run.galeT > 0 ? 1.7 : 1);
      P.x += ix * sp * dt; P.y += iy * sp * dt;
    }
    if (run.galeT > 0) {
      // Sturmlauf: Windspur, mit Orkan auch als Schaden am Boden
      run.galeT -= dt;
      if (m > 0.1 && parts.length < 800) parts.push({ x: P.x + rand(-6, 6), y: P.y + rand(-4, 8), vx: -ix * 60, vy: -iy * 60, life: 0.35, max: 0.35, r: 3, g: 'wind' });
      if (U('storm') && (run.trailT -= dt) <= 0) {
        run.trailT = 0.12;
        zones.push({ x: P.x, y: P.y, R: 42, life: 1.2, max: 1.2, tick: 0, dmg: 14 * P.dmgMul, k: 'wind' });
      }
    }
    run.slowT -= dt; run.slowCd -= dt; run.galeCd -= dt; run.shieldT -= dt;
    run.leech = Math.min(U('wLeech'), (run.leech || 0) + U('wLeech') * dt);
    P.moving = m > 0.1;
    if (Math.abs(ix) > 0.1) P.face = ix > 0 ? 1 : -1;
    if (P.moving) P.walk += dt;
    P.inv -= dt;
    P.hp = Math.min(P.maxHp, P.hp + P.regen * dt);
    run.dashCd -= dt; run.beaconCd -= dt; run.callCd -= dt;
    if (run.target && (run.target.t -= dt) <= 0) run.target = null;
  }

  // ---------- Fähigkeiten ----------
  // Abklingzeiten; Vollmond macht alle 20 % kürzer
  const cdOf = base => base * (U('fullmoon') ? 0.8 : 1) * (P.abilCd || 1);
  const CD = {
    dash: () => cdOf((U('dash') >= 2 ? 3.5 : 5) - (U('featherweight') ? 1 : 0)),
    beacon: () => cdOf(U('beacon') >= 2 ? 18 : 25),
    call: () => cdOf([12, 10, 8][Math.max(0, U('starcall') - 1)]),
    slow: () => cdOf(30),
    gale: () => cdOf(U('gale') >= 2 ? 14 : 20),
  };
  const canUse = () => state === 'play' && !P.dead && !run.won;
  function doDash() {
    if (!canUse() || !U('dash') || run.dashCd > 0) return;
    run.dashCd = CD.dash();
    P.dashT = 0.16; P.inv = Math.max(P.inv, 0.35);
    Snd.play('dash');
  }
  function doSlow() {
    if (!canUse() || !U('timeslow') || run.slowCd > 0) return;
    run.slowCd = CD.slow(); run.slowT = U('timeslow') >= 2 ? 6 : 4;

  }
  function doGale() {

    Snd.play('dash'); Snd.play('pulse');
  }
  function doBeacon() {
    const lv = U('beacon');

    run.beaconCd = CD.beacon();
    const R = 320, dmg = (lv >= 2 ? 120 : 60) * P.dmgMul;
    pulses.push({ x: P.x, y: P.y, R, life: 0.6, max: 0.6 });
    flashes.push({ x: P.x, y: P.y, r: R * 1.2, life: 0.45, max: 0.45 });
    for (const e of enemies) {
      if (e.dead) continue;
      const dx = e.x - P.x, dy = e.y - P.y, d = Math.hypot(dx, dy) || 1;
      if (d < R + e.r) hit(e, dmg, dx / d, dy / d, 600);

  // Sternenlenker und Sternenruf: Klick oder Tipp auf das Spielfeld
  function starClick(sx, sy) {

  }
  function starAt(x, y, quiet) {

    const lv = U('starcall');
    if (lv && run.callCd <= 0) {
      run.callCd = CD.call();
      const n = [3, 5, 7][lv - 1];
      for (let i = 0; i < n; i++) addStar(x + rand(-55, 55), y + rand(-45, 45), 0.35 + i * 0.07, null);
      Snd.play('moon');
    } else if (!quiet) Snd.play('click');
  }

  // ---------- Automatik (Sterne an den Pfadspitzen) ----------
  const AUTO_NODE = { dash: 'autoDash', beacon: 'autoBeacon', stars: 'autoStars', slow: 'autoSlow', gale: 'autoGale' };
  const AUTO_ABIL = { dash: 'dash', beacon: 'beacon', stars: 'starguide', slow: 'timeslow', gale: 'gale' };
  // Modus einer Automatik: 'off' | 'smart' (nur wenn es brenzlig ist) | 'always' (sobald die Abklingzeit vorbei ist, ab Stufe 2)
  function autoMode(k) {
    if (!U(AUTO_NODE[k]) || !U(AUTO_ABIL[k])) return 'off';
    const v = save.auto[k], lv2 = U(AUTO_NODE[k]) >= 2;
    if (v === false || v === 'off') return 'off';
    if (v === true || v === 'smart') return 'smart';
    return lv2 ? 'always' : 'smart';   // ohne eigene Wahl: die höchste gekaufte Stufe
  }
  const autoOn = k => autoMode(k) !== 'off';
  // umschalten: aus → clever → immer (immer erst ab Stufe 2) → aus
  function cycleAuto(k) {
    const m = autoMode(k), lv2 = U(AUTO_NODE[k]) >= 2;
    save.auto[k] = m === 'off' ? 'smart' : m === 'smart' && lv2 ? 'always' : 'off';
    persist();
  }
  const autoLabel = k => T({ off: 'modeOff', smart: U(AUTO_NODE[k]) >= 2 ? 'modeSmart' : 'on', always: 'modeAlways' }[autoMode(k)]);
  function countNear(r) {
    let n = 0, boss = false;
    for (const e of enemies) {
      if (e.dead || (e.x - P.x) ** 2 + (e.y - P.y) ** 2 >= r * r) continue;
      n++; if (e.d.boss) boss = true;
    }
    return [n, boss];
  }
  // Mitte der dichtesten Schattengruppe in deiner Nähe (Stichprobe, damit es schnell bleibt)
  function densest() {
    const c = [];
    for (const e of enemies) if (!e.dead && (e.x - P.x) ** 2 + (e.y - P.y) ** 2 < 420 * 420) { c.push(e); if (c.length >= 40) break; }
    let best = null, bn = 2;
    for (const a of c) {
      let n = 0;
      for (const b of c) if ((a.x - b.x) ** 2 + (a.y - b.y) ** 2 < 8100) n++;
      if (n > bn) { bn = n; best = a; }
    }
    return best;
  }
  function autoAbilities(dt) {
    if ((run.autoT = (run.autoT || 0) - dt) > 0) return;
    run.autoT = 0.1;   // zehnmal pro Sekunde nachsehen reicht
    const low = P.hp < P.maxHp * 0.35, near = countNear(420)[0] > 0;
    // Modus „immer“: einsetzen, sobald die Abklingzeit vorbei ist und Schatten in der Nähe sind
    if (autoMode('dash') === 'always' && run.dashCd <= 0 && P.moving && near) doDash();
    if (autoMode('beacon') === 'always' && run.beaconCd <= 0 && near) doBeacon();
    if (autoMode('slow') === 'always' && run.slowCd <= 0 && near) doSlow();
    if (autoMode('gale') === 'always' && run.galeCd <= 0 && near) doGale();
    if (autoOn('dash') && run.dashCd <= 0) {
      // ausweichen, wenn ein Schatten oder Geschoss fast da ist: weg von der Gefahr
      let th = null, td = 1e9;
      for (const e of enemies) { if (e.dead) continue; const d = Math.hypot(e.x - P.x, e.y - P.y) - e.r; if (d < 28 && d < td) { td = d; th = e; } }
      for (const s of spores) { if (s.dead) continue; const d = Math.hypot(s.x - P.x, s.y - P.y); if (d < 50 && d < td) { td = d; th = s; } }
      if (th) { const dx = P.x - th.x, dy = P.y - th.y, d = Math.hypot(dx, dy) || 1; P.dx = dx / d; P.dy = dy / d; doDash(); }
    }
    const [n280, boss] = countNear(280);
    if (autoOn('beacon') && run.beaconCd <= 0 && (n280 >= 18 || boss || (low && n280 >= 4))) doBeacon();
    if (autoOn('slow') && run.slowCd <= 0 && (n280 >= 25 || boss || (low && n280 >= 6))) doSlow();
    if (autoOn('gale') && run.galeCd <= 0) { const [n90] = countNear(90); if (n90 >= 6 || (low && n90 >= 2)) doGale(); }
    if (autoOn('stars') && (run.starAimT = (run.starAimT || 0) - 0.1) <= 0) {
      run.starAimT = autoMode('stars') === 'always' ? 0.4 : 1.2;
      const c = densest();
      if (c) starAt(c.x, c.y, true);
    }
  }
  function addStar(x, y, t, e) {
    const s = ITEMS.stars.s, l = Math.max(0, (run.items.stars || 1) - 1);
    let dmg = s.dmg[l] * P.dmgMul * P.starMul * P.wpnMul, R = s.rad[l] * (1 + 0.15 * U('bigstars'));
    const meteor = U('meteor') > 0 && ++run.starN % 4 === 0;
    if (meteor) { dmg *= 3; R *= 1.6; }
    stars.push({ e, x, y, t, R, dmg, meteor });
  }

  function hurtPlayer(d, src, e) {
    if (P.inv > 0 || P.dead || run.won) return;
    // Lichtschild fängt einen Treffer ganz ab
    if (U('wShield') && run.shieldT <= 0) {
      run.shieldT = [20, 15, 10][U('wShield') - 1]; P.inv = 0.4;
      pulses.push({ x: P.x, y: P.y, R: 70, life: 0.3, max: 0.3 });
      texts.push({ x: P.x, y: P.y - 30, v: T('blocked'), life: 0.8, crit: false });
      Snd.play('pulse');
      return;
    }
    d *= P.armor;
    P.hp -= d; P.inv = 0.6 + 0.2 * U('wGrace'); shake(5); Snd.play('hurt');
    if (dbg.hurt) dbg.hurt[src] = (dbg.hurt[src] || 0) + Math.round(d);
    if (e && !e.dead && U('wThorn')) { const dx = e.x - P.x, dy = e.y - P.y, dd = Math.hypot(dx, dy) || 1; hit(e, 25 * U('wThorn') * P.dmgMul, dx / dd, dy / dd, 80); }
    if (P.hp > 0) return;
    if (U('wAegis') && !run.aegis) {
      run.aegis = true; P.hp = 1; P.inv = 1.5;
      banner(T('aegisSaved')); Snd.play('level');
      return;
    }
    if (run.revives > 0) {
      run.revives--; P.hp = Math.round(P.maxHp * 0.6); P.inv = 2.5;
      banner(T('revive')); Snd.play('level');
      pulses.push({ x: P.x, y: P.y, R: 320, life: 0.6, max: 0.6 });
      for (const e of enemies) {
        if (e.dead) continue;
        const dx = e.x - P.x, dy = e.y - P.y, dd = Math.hypot(dx, dy) || 1;
        if (dd < 320) hit(e, 250, dx / dd, dy / dd, 500);
      }
    } else {
      P.hp = 0; P.dead = true; run.deathT = 0; Snd.play('lose');
    }
  }

  function updateEnemies(rdt) {
    const dt0 = rdt * (run.slowT > 0 ? 0.5 : 1);   // Mondruhe: alle Schatten halb so schnell
    const t = run.t, far = Math.max(W, H) / 2 / zoom + 420;
    for (const e of enemies) {
      if (e.dead) continue;
      const dt = e.spMul ? dt0 * e.spMul : dt0;   // der Arena-Titan lebt im eigenen Tempo
      const dx = P.x - e.x, dy = P.y - e.y, dist = Math.hypot(dx, dy) || 1;
      let mx = dx / dist, my = dy / dist, sp = e.d.sp * curWorld.speed * (dist < P.light * 0.9 ? 0.8 : 1);
      const bh = e.d.beh || e.type, sk = e.d.sk, dm = e.dmgMul || 1;
      switch (bh) {
        case 'moth': case 'wraith': case 'bat': {
          // flattern im Zickzack: Geister ruhig, Fledermäuse wild
          const fq = bh === 'bat' ? 9 : bh === 'wraith' ? 3 : 5, am = bh === 'bat' ? 1.1 : bh === 'wraith' ? 0.6 : 0.9;
          const a = Math.sin(t * fq + e.ph) * am, c = Math.cos(a), s = Math.sin(a);
          const nx = mx * c - my * s; my = mx * s + my * c; mx = nx;
          break;
        }
        case 'crow': case 'knight': {
          // kurz stillhalten, dann zustoßen (der Ritter langsamer, aber härter)
          const kn = bh === 'knight';
          if (e.st === 0) { e.tm -= dt; if (dist < (kn ? 260 : 300) && e.tm <= 0) { e.st = 1; e.tm = kn ? 0.6 : 0.45; e.ax = mx; e.ay = my; } }
          else if (e.st === 1) { sp = 0; e.tm -= dt; if (e.tm <= 0) { e.st = 2; e.tm = kn ? 0.45 : 0.5; Snd.play('dash'); } }
          else { sp = kn ? 330 : 360; mx = e.ax; my = e.ay; e.tm -= dt; if (e.tm <= 0) { e.st = 0; e.tm = kn ? rand(2.5, 4) : rand(1.8, 3); } }
          break;
        }
        case 'toad':
          // sitzt, dann ein weiter Sprung
          e.tm -= dt;
          if (e.st === 0) { sp = 0; if (e.tm <= 0) { e.st = 1; e.tm = 0.35; e.ax = mx; e.ay = my; } }
          else { sp = 250; mx = e.ax; my = e.ay; if (e.tm <= 0) { e.st = 0; e.tm = rand(0.6, 1.1); } }
          break;
        case 'golem':
          // langsam, wirft Eissplitter
          e.tm -= dt;
          if (e.tm <= 0 && dist < 380) {
            e.tm = rand(2.6, 3.4);
            spores.push({ x: e.x, y: e.y - 10, vx: (dx / dist) * 190, vy: (dy / dist) * 190, r: 8, dmg: 12, life: 4, k: sk || 'ice' });
            Snd.play('spore');
          }
          break;
        case 'toadking':
          // springt auf die Stelle, an der du stehst: Zielring, Flug, Aufprall mit Sporenring
          e.tm -= dt;
          if (e.st === 0) { if (e.tm <= 0) { e.st = 1; e.tm = 0.9; e.ax = P.x; e.ay = P.y; } }
          else if (e.st === 1) { sp = 0; if (e.tm <= 0) { e.st = 2; e.tm = 0.7; e.jx = e.x; e.jy = e.y; Snd.play('dash'); } }
          else {
            sp = 0;
            const q = 1 - Math.max(0, e.tm) / 0.7;
            e.x = e.jx + (e.ax - e.jx) * q; e.y = e.jy + (e.ay - e.jy) * q; e.hop = Math.sin(q * Math.PI) * 70;
            if (e.tm <= 0) {
              e.st = 0; e.tm = rand(2.4, 3.4); e.hop = 0; shake(7);
              flashes.push({ x: e.x, y: e.y, r: 200, life: 0.35, max: 0.35 });
              if (!P.dead && Math.hypot(P.x - e.x, P.y - e.y) < 120) hurtPlayer(e.d.dmg * curWorld.dmg * dm, 'boss', e);
              for (let i = 0; i < 16; i++) { const a = (i / 16) * TAU; spores.push({ x: e.x, y: e.y, vx: Math.cos(a) * 150, vy: Math.sin(a) * 150, r: 7, dmg: 9 * dm, life: 4, k: sk || 'moss' }); }
              Snd.play('star');
            }
          }
          break;
        case 'frostgiant':
          // wirft Eisbrocken, die zersplittern, und ruft alle 10 s Wölfe
          e.tm -= dt; e.t2 -= dt;
          if (e.tm <= 0 && dist < 560) {
            e.tm = rand(2.8, 3.6);
            spores.push({ x: e.x, y: e.y - 30, vx: (dx / dist) * 170, vy: (dy / dist) * 170, r: 15, dmg: 22, life: 2.6, k: sk || 'ice', split: 8 });
            Snd.play('spore');
          }
          if (e.t2 <= 0) { e.t2 = 10; for (let i = 0; i < 4; i++) { const a = (i / 4) * TAU; spawnEnemy(e.d.minion || 'wolf', e.x + Math.cos(a) * 70, e.y + Math.sin(a) * 70); } }
          break;
        case 'shadowking':
          // verschwindet, taucht neben dir auf, feuert einen Ring dunkler Kugeln, ruft Fledermäuse
          e.tm -= dt; e.t2 -= dt;
          if (e.st === 0) {
            if (e.tm <= 0) { e.st = 1; e.tm = 0.6; const a = Math.random() * TAU; e.ax = P.x + Math.cos(a) * 230; e.ay = P.y + Math.sin(a) * 230; }
          } else if (e.st === 1) {
            sp = 0; e.fade = Math.max(0, e.tm / 0.6);
            if (e.tm <= 0) { e.x = e.ax; e.y = e.ay; e.st = 2; e.tm = 0.5; }
          } else {
            sp = 0; e.fade = 1 - Math.max(0, e.tm) / 0.5;
            if (e.tm <= 0) {
              e.st = 0; e.tm = rand(4, 5.5); e.fade = 1;
              for (let i = 0; i < 18; i++) { const a = (i / 18) * TAU; spores.push({ x: e.x, y: e.y - 10, vx: Math.cos(a) * 150, vy: Math.sin(a) * 150, r: 7, dmg: 10, life: 4, k: sk || 'dark' }); }
              Snd.play('spore');
            }
          }
          if (e.t2 <= 0) { e.t2 = 9; for (let i = 0; i < 6; i++) { const a = (i / 6) * TAU; spawnEnemy(e.d.minion || 'bat', e.x + Math.cos(a) * 60, e.y + Math.sin(a) * 60); } }
          break;
        case 'spitter':
          if (dist < 210) { mx = -mx; my = -my; sp *= 0.6; } else if (dist < 270) sp = 0;
          e.tm -= dt;
          if (e.tm <= 0 && dist < 420) {
            e.tm = rand(2.2, 3);
            spores.push({ x: e.x, y: e.y - 4, vx: (dx / dist) * 160, vy: (dy / dist) * 160, r: 6, dmg: 9 * (1 + t / 400), life: 5, k: sk });
            Snd.play('spore');
          }
          break;
        case 'stag':
          e.tm -= dt;
          if (e.st === 0) { if (e.tm <= 0) { e.st = 1; e.tm = 0.8; e.ax = mx; e.ay = my; } }
          else if (e.st === 1) { sp = 0; if (e.tm <= 0) { e.st = 2; e.tm = 0.75; shake(5); Snd.play('dash'); } }
          else { sp = 520; mx = e.ax; my = e.ay; if (e.tm <= 0) { e.st = 0; e.tm = rand(3.5, 5); } }
          e.t2 -= dt;
          if (e.t2 <= 0 && e.st === 0) {
            e.t2 = 6.5;
            for (let i = 0; i < 14; i++) { const a = (i / 14) * TAU; spores.push({ x: e.x, y: e.y, vx: Math.cos(a) * 140, vy: Math.sin(a) * 140, r: 7, dmg: 9 * dm, life: 5, k: sk }); }
            Snd.play('spore');
          }
          break;
      }
      e.x += (mx * sp + e.kx) * dt; e.y += (my * sp + e.ky) * dt;
      const kd = Math.exp(-9 * dt); e.kx *= kd; e.ky *= kd;
      if (Math.abs(mx * sp) > 4) e.face = mx > 0 ? 1 : -1;
      e.anim += dt * e.d.anim; e.fl -= dt; e.oc -= dt;
      // in der Luft (Krötenkönig) oder fast unsichtbar (Schattenkönig): keine Berührung
      const ghost = (e.hop || 0) > 20 || (e.fade !== undefined && e.fade < 0.5);
      if (run.galeT > 0 && dist < e.r + P.r + 16) {
        // Sturmlauf schiebt Schatten beiseite, statt Schaden zu nehmen
        if (!e.d.boss) { e.kx = (-dx / dist) * 380; e.ky = (-dy / dist) * 380; }
      } else if (!P.dead && !ghost && dist < e.r + P.r - 2) hurtPlayer((e.d.boss ? e.d.dmg : e.d.dmg * (1 + t / 600)) * curWorld.dmg * (e.dmgMul || 1), e.type, e);
      if (dist > far && !e.d.boss) { const p = edgePoint(); e.x = p[0]; e.y = p[1]; e.kx = e.ky = 0; }
    }
  }

  // ---------- Treffer, Beute, Erfahrung ----------
  function hit(e, dmg, nx, ny, kb) {
    if (e.dead) return;
    const crit = Math.random() < P.crit;
    if (crit) dmg *= 2;
    if (P.moving && U('windheart')) dmg *= 1.12;
    if (e.d.boss) dmg *= 1 + 0.3 * U('wrath');
    if (U('wLast') && P.hp < P.maxHp * 0.25) dmg *= 1 + 0.3 * U('wLast');
    e.hp -= dmg; e.fl = e.d.boss ? 0.06 : 0.1;
    if (kb && !e.d.boss) { const k = kb / e.d.mass; e.kx += nx * k; e.ky += ny * k; }
    if (texts.length < (crit ? 40 : 28)) texts.push({ x: e.x + rand(-6, 6), y: e.y - e.r - 4, v: Math.round(dmg), life: crit ? 0.75 : 0.55, crit });
    Snd.play('hit');
    if (e.hp <= 0) kill(e);
  }
  function addLoot(t, x, y, v) { loot.push({ t, x, y, m: false, sp: 0, v: v || 0 }); }
  function kill(e) {
    e.dead = true; run.kills++;
    const d = e.d;
    const xp = Math.random() < 0.04 * U('gGold') ? d.xp * 5 : d.xp;   // goldene Funken
    if (gems.length >= 450) gems[(Math.random() * gems.length) | 0].v += xp;
    else gems.push({ x: e.x + rand(-4, 4), y: e.y + rand(-4, 4), v: xp, m: false, sp: 0 });
    // Lichtdurst: höchstens 1 Leben pro Sekunde und Stufe, damit dichte Welten nicht unsterblich machen
    if (U('wLeech') && run.leech > 0) { const h = Math.min(run.leech, 0.3 * U('wLeech')); run.leech -= h; P.hp = Math.min(P.maxHp, P.hp + h); }
    const ar = run.endless;   // Arena-Pfad: mehr Beute, nur in der Arena
    // Wunsch „Doppelte Beute“ und Glücksrad: die Beute wird mehrmals ausgewürfelt
    const rolls = 1 + B('loot') + (Math.random() < 0.1 * U('gWheel') ? 1 : 0);
    const rare = 1 + 0.25 * U('gRare');
    if (e.titan) titanLoot(e);
    else if (d.boss) {
      run.bossKills++;
      for (let k = 0; k < rolls; k++) {
        for (let i = 0; i < 12 + (ar ? 4 * U('arenaTrophy') : 0); i++) addLoot('amber', e.x + rand(-45, 45), e.y + rand(-35, 35));
        addLoot('berry', e.x + rand(-20, 20), e.y + 20);
        for (let i = 0; i < 3 + U('shardseeker') + (ar ? U('arenaTrophy') : 0); i++) addLoot('shard', e.x + rand(-35, 35), e.y + rand(-30, 30));
        addLoot('amberheart', e.x + rand(-20, 20), e.y - 24);
      }
      shake(9);
      flashes.push({ x: e.x, y: e.y, r: 320, life: 0.5, max: 0.5 });
      Snd.play('win');
    } else {
      const amberC = 0.032 * P.amberMul * (ar ? 1 + 0.25 * U('arenaLoot') : 1);
      // Beeren pro Minute bleiben gleich, auch wenn eine Welt viel mehr Schatten schickt
      const berry = 0.007 * rare * (1 + 0.6 * U('berries')) * (ar ? 1 + 0.5 * U('arenaHeal') : 1) / Math.max(1, curWorld.spawn);
      const shardC = 0.0015 * (1 + U('mooncatch')) * (1 + 0.15 * U('gShard')) * (ar ? 1 + 0.5 * U('arenaShard') : 1);
      const moonC = 0.002 * rare, heartC = 0.0018 * rare;
      for (let k = 0; k < rolls; k++) {
        const r = Math.random(), x = e.x + (k ? rand(-14, 14) : 0), y = e.y + (k ? rand(-10, 10) : 0);
        if (r < amberC) addLoot('amber', x, y);
        else if (r < amberC + berry) addLoot('berry', x, y);
        else if (r < amberC + berry + moonC) addLoot('moon', x, y);
        else if (r < amberC + berry + moonC + shardC) addLoot('shard', x, y);
        else if (r < amberC + berry + moonC + shardC + heartC) addLoot('amberheart', x, y);
      }
    }
    if (run.boss === e) run.boss = enemies.find(o => !o.dead && o.d.boss) || null;
    smoke(e.x, e.y, d.boss ? 30 : 6, d.smoke);
    for (const [ex, ey] of d.eyes) parts.push({ x: e.x + ex * e.face, y: e.y + ey, vx: rand(-60, 60), vy: rand(-90, -30), life: 0.5, max: 0.5, r: 3, g: d.eye });
    Snd.play('pop');
  }
  function smoke(x, y, n, col) {
    for (let i = 0; i < n && parts.length < 800; i++) {
      const a = Math.random() * TAU, s = rand(20, 70), l = rand(0.4, 0.8);
      parts.push({ x: x + rand(-6, 6), y: y + rand(-8, 4), vx: Math.cos(a) * s, vy: Math.sin(a) * s - 20, life: l, max: l, r: rand(5, 10), smoke: col });
    }
  }
  function burst(x, y, n, g, sp = 160) {
    for (let i = 0; i < n && parts.length < 800; i++) {
      const a = Math.random() * TAU, s = rand(0.3, 1) * sp, l = rand(0.25, 0.55);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: l, max: l, r: rand(2, 4), g });
    }
  }
  function gainXp(v) {
    run.xp += v * P.xpMul;
    while (run.xp >= run.need) { run.xp -= run.need; run.lv++; run.need = xpNeed(run.lv); run.pending++; }
  }

  // ---------- Waffen ----------
  const NB = [];
  function nearest(n, range) {
    NB.length = 0;
    const r2 = range * range;
    for (const e of enemies) {
      if (e.dead) continue;
      const dx = e.x - P.x, dy = e.y - P.y, d = dx * dx + dy * dy;
      if (d > r2) continue;
      if (NB.length < n) NB.push([d, e]);
      else if (d < NB[n - 1][0]) NB[n - 1] = [d, e];
      else continue;
      NB.sort((a, b) => a[0] - b[0]);
    }
    return NB.map(x => x[1]);
  }
  function updateWeapons(dt) {
    const it = run.items, ws = run.ws, m = P.dmgMul * P.wpnMul;
    if (it.spark) {
      const s = ITEMS.spark.s, l = it.spark - 1;
      if ((ws.spark -= dt) <= 0) {
        const n = s.n[l], tg = nearest(n, 540);
        if (tg.length) {
          ws.spark = s.cd[l] * P.cdMul;
          for (let i = 0; i < n; i++) {
            const e = tg[i % tg.length];
            let a = Math.atan2(e.y - (P.y - 4), e.x - P.x);
            if (i >= tg.length) a += (i % 2 ? 1 : -1) * 0.2 * Math.ceil((i - tg.length + 1) / 2);
            shots.push({ x: P.x + Math.cos(a) * 12, y: P.y - 4 + Math.sin(a) * 12, vx: Math.cos(a) * 560, vy: Math.sin(a) * 560, r: 6, dmg: s.dmg[l] * m * (1 + 0.15 * U('fSpark')), pierce: s.pierce[l] + U('pierce'), life: 1.1, hit: [] });
          }
          Snd.play('shoot');
        } else ws.spark = 0.1;
      }
    }
    ff.length = 0;
    if (it.fireflies) {
      const s = ITEMS.fireflies.s, l = it.fireflies - 1, n = s.n[l] + U('swarmer'), R = s.rad[l];
      ws.ffA += dt * s.sp[l] * (1 + 0.05 * U('fFly'));
      for (let i = 0; i < n; i++) {
        const a = ws.ffA + (i * TAU) / n, x = P.x + Math.cos(a) * R, y = P.y - 4 + Math.sin(a) * R;
        ff.push(x, y);
        const q = query(x, y, 60);
        for (let j = 0; j < q.length; j++) {
          const e = q[j];
          if (e.oc > 0) continue;
          const dx = e.x - x, dy = e.y - y;
          if (dx * dx + dy * dy < (e.r + 8) ** 2) {
            e.oc = 0.4;
            const d = Math.hypot(e.x - P.x, e.y - P.y) || 1;
            hit(e, s.dmg[l] * m * (1 + 0.12 * U('fFly')), (e.x - P.x) / d, (e.y - P.y) / d, 120);
          }
        }
      }
    }
    if (it.pulse) {
      const s = ITEMS.pulse.s, l = it.pulse - 1, R = s.rad[l] * (1 + 0.1 * U('heat'));
      const fire = f => {
        pulses.push({ x: P.x, y: P.y, R, life: 0.45, max: 0.45 });
        const q = query(P.x, P.y, R + 50);
        for (let j = 0; j < q.length; j++) {
          const e = q[j], dx = e.x - P.x, dy = e.y - P.y, d = Math.hypot(dx, dy) || 1;
          if (d < R + e.r) hit(e, s.dmg[l] * m * f * (1 + 0.12 * U('fPulse')), dx / d, dy / d, 280);
        }
        for (const sp of spores) if ((sp.x - P.x) ** 2 + (sp.y - P.y) ** 2 < R * R) sp.dead = true;
        Snd.play('pulse');
      };
      if ((ws.pulse -= dt) <= 0) { ws.pulse = s.cd[l] * P.cdMul; fire(1); if (U('double')) ws.pulse2 = 0.3; }
      if (ws.pulse2 > 0 && (ws.pulse2 -= dt) <= 0) fire(0.6);
    }
    if (it.stars) {
      const s = ITEMS.stars.s, l = it.stars - 1, n = s.n[l] + U('starswarm');
      if ((ws.stars -= dt) <= 0) {
        const tg = run.target;
        if (tg) {
          // Sternenlenker: die Salve schlägt dort ein, wo zuletzt geklickt wurde
          ws.stars = s.cd[l] * P.cdMul;
          for (let i = 0; i < n; i++) addStar(tg.x + rand(-45, 45), tg.y + rand(-35, 35), 0.5 + i * 0.06, null);
        } else {
          const c = [];
          for (const e of enemies) if (!e.dead && (e.x - P.x) ** 2 + (e.y - P.y) ** 2 < 440 * 440) c.push(e);
          if (c.length) {
            ws.stars = s.cd[l] * P.cdMul;
            for (let i = 0; i < n && c.length; i++) { const e = c.splice((Math.random() * c.length) | 0, 1)[0]; addStar(e.x, e.y, 0.5, e); }
          } else ws.stars = 0.25;
        }
      }
    }
  }
  function impact(s) {
    const q = query(s.x, s.y, s.R + 50);
    for (let i = 0; i < q.length; i++) {
      const e = q[i], dx = e.x - s.x, dy = e.y - s.y, d = Math.hypot(dx, dy) || 1;
      if (d < s.R + e.r) hit(e, s.dmg, dx / d, dy / d, 160);
    }
    flashes.push({ x: s.x, y: s.y, r: s.R * 2.4, life: 0.3, max: 0.3 });
    if (s.meteor) { burst(s.x, s.y, 24, 'amber', 380); shake(6); } else { burst(s.x, s.y, 10, 'gold', 260); shake(2.5); }
    Snd.play('star');
    const cr = U('crater');
    if (cr) zones.push({ x: s.x, y: s.y, R: s.R * 0.9, life: 1 + cr, max: 1 + cr, tick: 0, dmg: s.dmg * 0.25 });
  }

  function updateShots(dt) {
    for (const b of shots) {
      if (b.dead) continue;
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      if (b.life <= 0) { b.dead = true; continue; }
      const q = query(b.x, b.y, b.r + 50);
      for (let i = 0; i < q.length; i++) {
        const e = q[i];
        if (e.dead || b.hit.includes(e)) continue;
        const dx = e.x - b.x, dy = e.y - b.y, rr = e.r + b.r;
        if (dx * dx + dy * dy < rr * rr) {
          b.hit.push(e);
          hit(e, b.dmg, b.vx / 560, b.vy / 560, 90);
          burst(b.x, b.y, 3, 'warm', 90);
          if (b.pierce-- <= 0) { b.dead = true; break; }
        }
      }
    }
    const sk = run.slowT > 0 ? 0.5 : 1;
    for (const s of spores) {
      if (s.dead) continue;
      s.x += s.vx * dt * sk; s.y += s.vy * dt * sk; s.life -= dt;
      if (s.life <= 0) { s.dead = true; if (s.split) splitSpore(s); continue; }
      const dx = s.x - P.x, dy = s.y - P.y;
      if (!P.dead && dx * dx + dy * dy < (s.r + P.r) ** 2) { s.dead = true; hurtPlayer(s.dmg * curWorld.dmg, 'spore'); if (s.split) splitSpore(s); }
    }
  }
  // Eisbrocken des Frostriesen zerspringen in kleine Splitter
  function splitSpore(s) {
    for (let i = 0; i < s.split; i++) {
      const a = (i / s.split) * TAU;
      spores.push({ x: s.x, y: s.y, vx: Math.cos(a) * 200, vy: Math.sin(a) * 200, r: 5, dmg: 8, life: 1.6, k: s.k });
    }
    burst(s.x, s.y, 8, 'ice', 140);
  }

  function updatePickups(dt) {
    const px = P.x, py = P.y - 2;
    for (const g of gems) {
      if (g.dead) continue;
      const dx = px - g.x, dy = py - g.y, d = Math.hypot(dx, dy);
      if (!g.m && d < P.magnet) g.m = true;
      if (!g.m) continue;
      g.sp = Math.min(g.sp + 1600 * dt, 1000);
      if (d < P.r + 6 || g.sp * dt >= d) { g.dead = true; gainXp(g.v); Snd.play('gem'); continue; }
      g.x += (dx / d) * g.sp * dt; g.y += (dy / d) * g.sp * dt;
    }
    for (const o of loot) {
      if (o.dead) continue;
      const dx = px - o.x, dy = py - o.y, d = Math.hypot(dx, dy);
      if (!o.m && d < P.magnet) o.m = true;
      if (!o.m) continue;
      o.sp = Math.min(o.sp + 1400 * dt, 900);
      if (d < P.r + 6 || o.sp * dt >= d) {
        o.dead = true;
        if (o.t === 'amber') { run.amber += o.v || 1; Snd.play('amber'); }
        else if (o.t === 'shard') { run.shards += o.v || 1; Snd.play('moon'); burst(P.x, P.y, 6, 'silver', 110); }
        else if (o.t === 'amberheart') {
          // wie der Mondstein für Funken, nur für Bernstein und Mondsplitter
          for (const l of loot) if (l.t === 'amber' || l.t === 'shard') l.m = true;
          Snd.play('amber'); Snd.play('moon'); toast(T('amberHeart'));
          flashes.push({ x: P.x, y: P.y, r: 280, life: 0.45, max: 0.45 });
        }
        else if (o.t === 'berry') { P.hp = Math.min(P.maxHp, P.hp + 30 * (1 + 0.25 * U('berries'))); Snd.play('heal'); burst(P.x, P.y, 8, 'berry', 120); }
        else { for (const g of gems) g.m = true; Snd.play('moon'); toast(T('moonStone')); flashes.push({ x: P.x, y: P.y, r: 260, life: 0.4, max: 0.4 }); }
        continue;
      }
      o.x += (dx / d) * o.sp * dt; o.y += (dy / d) * o.sp * dt;
    }
  }

  function updateFx(dt) {
    for (const p of parts) {
      p.life -= dt;
      if (p.life <= 0) { p.dead = true; continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      const f = Math.exp(-dt * (p.smoke ? 2 : 4)); p.vx *= f; p.vy *= f;
    }
    for (const t of texts) { t.life -= dt; t.y -= 34 * dt; if (t.life <= 0) t.dead = true; }
    for (const p of pulses) { p.life -= dt; if (p.life <= 0) p.dead = true; }
    for (const f of flashes) { f.life -= dt; if (f.life <= 0) f.dead = true; }
    for (const s of stars) {
      if (s.dead) continue;
      s.t -= dt;
      if (s.e && !s.e.dead && s.t > 0.15) { s.x = s.e.x; s.y = s.e.y; }
      if (s.t <= 0) { s.dead = true; impact(s); }
    }
    for (const z of zones) {
      z.life -= dt;
      if (z.life <= 0) { z.dead = true; continue; }
      if ((z.tick -= dt) > 0) continue;
      z.tick = 0.5;
      const q = query(z.x, z.y, z.R + 50);
      for (let i = 0; i < q.length; i++) { const e = q[i]; if ((e.x - z.x) ** 2 + (e.y - z.y) ** 2 < (z.R + e.r) ** 2) hit(e, z.dmg, 0, 0, 0); }
    }
  }

  function compact(a) {
    let j = 0;
    for (let i = 0; i < a.length; i++) { const e = a[i]; if (!e.dead) a[j++] = e; }
    a.length = j;
  }

  // ---------- Begleiter ----------
  function nearestTo(x, y, range) {
    let best = null, bd = range * range;
    for (const e of enemies) {
      if (e.dead) continue;
      const d = (e.x - x) ** 2 + (e.y - y) ** 2;
      if (d < bd) { bd = d; best = e; }
    }
    return best;
  }
  function moveTo(p, tx, ty, sp, dt) {
    const dx = tx - p.x, dy = ty - p.y, d = Math.hypot(dx, dy);
    if (d < 1) { p.vx = 0; return d; }
    const s = Math.min(d, sp * dt);
    p.x += (dx / d) * s; p.y += (dy / d) * s; p.vx = (dx / d) * sp;
    return d;
  }
  // Begleiter laufen los und arbeiten selbstständig, aber höchstens so weit von dir weg (ihre „Leine“)
  const LEASH = { fox: 460, owl: 420, hedgehog: 340, wisp: 520 };
  const distP = o => Math.hypot(o.x - P.x, o.y - P.y);
  // nächster Schatten zum Begleiter, der noch innerhalb seiner Leine liegt
  function petTarget(p, range, minFromP = 0) {
    let best = null, bd = range * range;
    for (const e of enemies) {
      if (e.dead) continue;
      const d = (e.x - p.x) ** 2 + (e.y - p.y) ** 2, dp = distP(e);
      if (d < bd && dp < LEASH[p.id] && dp >= minFromP) { bd = d; best = e; }
    }
    return best;
  }
  // nichts zu tun: in deiner Nähe herumstreunen
  function roam(p, dt, sp) {
    if ((p.rt = (p.rt || 0) - dt) <= 0) {
      p.rt = rand(1.5, 3);
      const a = Math.random() * TAU, r = rand(50, 130);
      p.rx = Math.cos(a) * r; p.ry = Math.sin(a) * r * 0.7;
    }
    const tx = P.x + p.rx, ty = P.y + p.ry, d = Math.hypot(tx - p.x, ty - p.y);
    if (d > 8) moveTo(p, tx, ty, d > 160 ? sp * 1.8 : sp * 0.6, dt); else p.vx = 0;
  }
  function updatePets(dt) {
    for (const p of run.pets) {
      const s = COMPS[p.id].s, i = Math.min(2, (save.comp[p.id] || 1) - 1);
      p.anim += dt * 8; p.t -= dt;
      const away = distP(p) > LEASH[p.id];   // zu weit weg: erst zurückkommen
      if (p.id === 'fox') {
        // streift umher und jagt Schatten, auch ein gutes Stück von dir entfernt
        if (p.tg && (p.tg.dead || distP(p.tg) > LEASH.fox)) p.tg = null;
        if (!p.tg && !away) p.tg = petTarget(p, 420);
        const tg = p.tg;
        if (tg) {
          const d = moveTo(p, tg.x, tg.y, 300, dt);
          if (d < tg.r + 12 && p.t <= 0) { p.t = s.cd[i]; const k = d || 1; hit(tg, s.dmg[i] * P.petMul, (tg.x - p.x) / k, (tg.y - p.y) / k, 60); }
        } else if (away) moveTo(p, P.x, P.y, 340, dt);
        else roam(p, dt, 170);
      } else if (p.id === 'owl') {
        // fliegt zu den Schatten und kreist über ihnen, sonst über dir
        if (p.tg && (p.tg.dead || distP(p.tg) > LEASH.owl)) p.tg = null;
        // lieber Schatten etwas weiter draußen, damit sie dir die Ränder frei hält
        if ((p.rt = (p.rt || 0) - dt) <= 0) { p.rt = 2.5; p.tg = away ? null : petTarget(p, 480, 140) || petTarget(p, 480); }
        p.a += dt * 2.2;
        const tg = p.tg, cx = tg ? tg.x : P.x, cy = (tg ? tg.y : P.y) - 34, R = tg ? 38 : 50;
        moveTo(p, cx + Math.cos(p.a) * R, cy + Math.sin(p.a) * R * 0.35, 280, dt);
        p.vx = 0;   // die Eule schaut immer nach vorn
        if (p.t <= 0) {
          const e = nearestTo(p.x, p.y, 430);
          if (e) {
            p.t = s.cd[i];
            const a = Math.atan2(e.y - p.y, e.x - p.x);
            shots.push({ x: p.x, y: p.y, vx: Math.cos(a) * 520, vy: Math.sin(a) * 520, r: 6, dmg: s.dmg[i] * P.petMul, pierce: 1, life: 1.2, hit: [], k: 'feather' });
          } else p.t = 0.2;
        }
      } else if (p.id === 'hedgehog') {
        // läuft mitten in die Schatten und schießt dort Stacheln in alle Richtungen
        if (p.tg && (p.tg.dead || distP(p.tg) > LEASH.hedgehog)) p.tg = null;
        if (!p.tg && !away) p.tg = petTarget(p, 320);
        const tg = p.tg;
        if (tg) { if (Math.hypot(tg.x - p.x, tg.y - p.y) > 45) moveTo(p, tg.x, tg.y, 190, dt); else p.vx = 0; }
        else if (away) moveTo(p, P.x, P.y, 300, dt);
        else roam(p, dt, 150);
        if (p.t <= 0 && nearestTo(p.x, p.y, 170)) {
          p.t = s.cd[i];
          const n = s.n[i], off = Math.random() * TAU;
          for (let k = 0; k < n; k++) {
            const a = off + (k * TAU) / n;
            shots.push({ x: p.x, y: p.y - 3, vx: Math.cos(a) * 380, vy: Math.sin(a) * 380, r: 5, dmg: s.dmg[i] * P.petMul, pierce: 0, life: 0.6, hit: [], k: 'spike' });
          }
        }
      } else if (p.id === 'wisp') {
        // fliegt los zu liegengebliebenen Funken und Beute, schickt sie zu dir und heilt dich
        if (p.tg && (p.tg.dead || p.tg.m || distP(p.tg) > LEASH.wisp)) p.tg = null;
        if (!p.tg && !away && (p.rt = (p.rt || 0) - dt) <= 0) {
          p.rt = 0.3;
          let bd = s.roam[i] ** 2;
          for (const list of [loot, gems]) for (const g of list) {
            if (g.dead || g.m) continue;
            const d = (g.x - p.x) ** 2 + (g.y - p.y) ** 2;
            if (d < bd && distP(g) < LEASH.wisp) { bd = d; p.tg = g; }
          }
        }
        if (p.tg) moveTo(p, p.tg.x, p.tg.y, 280, dt);
        else { p.a += dt * 0.9; moveTo(p, P.x + Math.cos(p.a) * 70, P.y - 10 + Math.sin(p.a) * 40, away ? 340 : 220, dt); }
        const R2 = s.rad[i] ** 2;
        for (const g of gems) if (!g.m && (g.x - p.x) ** 2 + (g.y - p.y) ** 2 < R2) g.m = true;
        for (const o of loot) if (!o.m && (o.x - p.x) ** 2 + (o.y - p.y) ** 2 < R2) o.m = true;
        P.hp = Math.min(P.maxHp, P.hp + s.heal[i] * (1 + 0.2 * U('bond')) * dt);
      }
      if (Math.abs(p.vx) > 5) p.face = p.vx > 0 ? 1 : -1;
    }
  }

  function startDawn() {
    run.won = true; run.dawnT = 0; P.inv = 99;
    for (const e of enemies) if (!e.dead) { e.dead = true; smoke(e.x, e.y, 4, e.d.smoke); }
    for (const s of spores) s.dead = true;
    for (const g of gems) g.m = true;
    run.boss = null;
    banner(T('winTitle'), 2.6); Snd.play('win');
  }

  function step(dt) {
    if (P.dead) {
      run.deathT += dt;
      if (run.deathT > 1.6) { endRun(false); return; }
      dt *= 0.3;
    }
    if (run.won) {
      run.dawnT += dt;
      if (run.dawnT > 3) { endRun(true); return; }
    } else if (!P.dead) {
      run.t += dt;
      if (!run.endless && run.t >= RUN_LEN) startDawn();   // die Arena-Nacht endet nie
    }
    if (!P.dead) updatePlayer(dt);
    if (!run.won && !P.dead) spawnTick(dt);
    updateEnemies(dt);
    buildGrid(); separate();
    if (!P.dead && !run.won) { updateWeapons(dt); updatePets(dt); autoAbilities(dt); }
    updateShots(dt); updatePickups(dt); updateFx(dt);
    for (const a of [enemies, shots, spores, gems, loot, parts, texts, pulses, stars, flashes, zones]) compact(a);
    // alle 10 Sekunden still speichern, falls die Seite neu lädt oder der Browser abstürzt
    if (!P.dead && !run.won && (run.saveT += dt) > 10) { run.saveT = 0; saveNight(true); }
    const k = 1 - Math.exp(-dt * 7);
    cam.x += (P.x - cam.x) * k; cam.y += (P.y - cam.y) * k;
    if (run.pending > 0 && !P.dead && !run.won) openLevelUp();
    updateHud();
  }

  function menuStep(dt) {
    menuT += dt;
    P.x = 0; P.y = 0; P.face = 1; P.moving = false; P.inv = 0;
    const wide = W > 760;
    cam.x = P.x - (wide ? (W / 2 / zoom) * 0.32 : 0);
    cam.y = P.y + (wide ? -10 : (H / 2 / zoom) * 0.5);
  }

  // ---------- Zeichnen ----------
  const LN = 600, Lx = new Float32Array(LN), Ly = new Float32Array(LN), Lr = new Float32Array(LN), La = new Float32Array(LN);
  let Lc = 0;
  function light(x, y, r, a) { if (Lc < LN) { Lx[Lc] = x; Ly[Lc] = y; Lr[Lc] = r; La[Lc] = a; Lc++; } }
  function glow(k, x, y, r, a) { ctx.globalAlpha = a; ctx.drawImage(GL[k], x - r, y - r, r * 2, r * 2); }

  function drawDecor(L, T0, R, B) {
    mushPts.length = 0;
    const x0 = Math.floor(L / DC) - 1, x1 = Math.floor(R / DC), y0 = Math.floor(T0 / DC) - 1, y1 = Math.floor(B / DC);
    for (let cy = y0; cy <= y1; cy++) for (let cx = x0; cx <= x1; cx++) {
      const h = hash3(cx, cy, 1);
      let s;
      const v = hash3(cx, cy, 4);
      if (h < 0.16) s = curDecor.glow[(v * 3) | 0];
      else if (h < 0.38) s = curDecor.plant[(v * 2) | 0];
      else if (h < 0.48) s = curDecor.rock[(v * 2) | 0];
      else if (h < 0.52) s = curDecor.log[0];
      else continue;
      const x = (cx + 0.15 + hash3(cx, cy, 2) * 0.7) * DC, y = (cy + 0.15 + hash3(cx, cy, 3) * 0.7) * DC;
      ctx.drawImage(s.c, x - s.h, y - s.h, s.s, s.s);
      if (h < 0.16) { mushPts.push(x, y - 6); light(x, y - 6, 90, 0.45); }
    }
  }

  function drawPlayer(time) {
    const bob = P.moving ? Math.abs(Math.sin(P.walk * 9)) * -2 : Math.sin(time * 2) * 0.5;
    const sw = P.moving ? Math.sin(P.walk * 9) * 1.4 : 0;
    ctx.globalAlpha = 1;
    ctx.drawImage(shadowSpr, P.x - 13, P.y + 8, 26, 9);
    if (P.inv > 0 && run && !run.won && Math.sin(time * 40) > 0) ctx.globalAlpha = 0.45;
    ctx.save(); ctx.translate(P.x, P.y + bob); ctx.scale(P.face, 1);
    ctx.fillStyle = '#2b4a3a'; ctx.beginPath();
    ctx.moveTo(-9, 12); ctx.lineTo(-7, -3); ctx.quadraticCurveTo(0, -9, 7, -3); ctx.lineTo(9, 12); ctx.quadraticCurveTo(0, 15, -9, 12); ctx.fill();
    ctx.strokeStyle = '#3f6b52'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(-8.5, 11.5); ctx.quadraticCurveTo(0, 14.5, 8.5, 11.5); ctx.stroke();
    ctx.fillStyle = '#35604a'; ctx.beginPath(); ctx.arc(0, -8, 7.5, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-6, -11); ctx.quadraticCurveTo(-11, -13, -12, -7); ctx.quadraticCurveTo(-8, -8, -6, -5); ctx.fill();
    ctx.fillStyle = '#0c1311'; ctx.beginPath(); ctx.ellipse(2.6, -7.2, 4.4, 4, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffd9a0'; ctx.fillRect(1.2, -8, 1.3, 1.3); ctx.fillRect(4.2, -8, 1.3, 1.3);
    ctx.strokeStyle = '#223b2e'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(4, -1); ctx.lineTo(10, 1 + sw * 0.5); ctx.stroke();
    ctx.strokeStyle = '#6b5636'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(11, sw * 0.5); ctx.lineTo(11, 2.5 + sw); ctx.stroke();
    ctx.fillStyle = '#3b2f1e'; ctx.fillRect(8.2, 2.5 + sw, 5.6, 7.5);
    ctx.fillStyle = '#ffd27a'; ctx.fillRect(9.2, 3.8 + sw, 3.6, 5);
    ctx.restore();
    ctx.globalAlpha = 1;
    P.lx = P.x + 11 * P.face; P.ly = P.y + bob + 6.3 + sw;
  }

  // Wetter: Nebel (Moor), Schnee (Frostwald), Glutfunken (Schattenreich), leicht mit der Kamera verschoben
  const WX = Array.from({ length: 90 }, () => ({ x: Math.random(), y: Math.random(), s: rand(0.6, 1.4), p: rand(0, TAU) }));
  const fogSpr = softSprite('rgba(170,190,160,.9)', 'rgba(170,190,160,0)');
  const wrap1 = v => ((v % 1) + 1) % 1;
  function drawWeather(kind, time, cx, cy) {
    if (!kind) return;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const ox = (cx * zoom) / W, oy = (cy * zoom) / H;
    if (kind === 'snow') {
      ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = '#eaf4ff';
      for (const f of WX) {
        const x = wrap1(f.x - ox + time * 0.015 * f.s + Math.sin(time * 0.8 + f.p) * 0.01) * W, y = wrap1(f.y - oy + time * 0.07 * f.s) * H;
        ctx.globalAlpha = 0.35 + 0.35 * (f.s / 1.4);
        ctx.beginPath(); ctx.arc(x, y, 1.8 * f.s, 0, TAU); ctx.fill();
      }
    } else if (kind === 'embers') {
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 50; i++) {
        const f = WX[i], x = wrap1(f.x - ox + Math.sin(time * 0.7 + f.p) * 0.02) * W, y = wrap1(f.y - oy - time * 0.035 * f.s) * H, r = 6 * f.s;
        ctx.globalAlpha = 0.6 * (0.5 + 0.5 * Math.sin(time * 3 + f.p));
        ctx.drawImage(GL[curWorld.wglow || 'red'], x - r, y - r, r * 2, r * 2);
      }
    } else if (kind === 'sand') {
      ctx.globalCompositeOperation = 'source-over'; ctx.strokeStyle = '#e8c890'; ctx.lineWidth = 1.3;
      for (const f of WX) {
        const x = wrap1(f.x - ox + time * 0.12 * f.s) * W, y = wrap1(f.y - oy + Math.sin(time * 0.9 + f.p) * 0.012) * H;
        ctx.globalAlpha = 0.16 + 0.22 * (f.s / 1.4);
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 16 * f.s, y + 1.5); ctx.stroke();
      }
    } else if (kind === 'fog') {
      ctx.globalCompositeOperation = 'source-over';
      for (let i = 0; i < 12; i++) {
        const f = WX[i], r = (170 + 90 * f.s) * Math.max(1, zoom);
        const x = wrap1(f.x - ox * 0.6 + time * 0.006 * f.s) * (W + r * 2) - r, y = wrap1(f.y - oy * 0.6) * (H + r) - r * 0.5;
        ctx.globalAlpha = 0.11;
        ctx.drawImage(fogSpr, x - r, y - r * 0.6, r * 2, r * 1.2);
      }
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }

  const menuMoths = [];
  function render(time) {
    const hw = W / 2 / zoom, hh = H / 2 / zoom;
    let ox = 0, oy = 0;
    if (shakeAmt > 0.1 && !REDUCED) { ox = (Math.random() * 2 - 1) * shakeAmt; oy = (Math.random() * 2 - 1) * shakeAmt; }
    const cx = cam.x + ox, cy = cam.y + oy, k = DPR * zoom, tx = (DPR * W) / 2 - cx * k, ty = (DPR * H) / 2 - cy * k;
    const L = cx - hw - 80, R = cx + hw + 80, T0 = cy - hh - 80, B = cy + hh + 80;
    const inView = (x, y) => x > L && x < R && y > T0 && y < B;
    Lc = 0;

    // Boden und Deko
    ctx.setTransform(k, 0, 0, k, tx, ty);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    ctx.fillStyle = groundPat; ctx.fillRect(L, T0, R - L, B - T0);
    drawDecor(L, T0, R, B);
    for (const z of zones) if (z.k !== "wind" && inView(z.x, z.y)) { ctx.globalAlpha = Math.min(1, (z.life / z.max) * 1.5) * 0.6; ctx.drawImage(shadowSpr, z.x - z.R, z.y - z.R * 0.6, z.R * 2, z.R * 1.2); }
    ctx.globalAlpha = 1;

    // Funken und Beute
    for (const g of gems) if (inView(g.x, g.y)) { const s = gemSpr[gemTier(g.v)]; ctx.drawImage(s.c, g.x - 7, g.y - 7, 14, 14); }
    for (const o of loot) if (inView(o.x, o.y)) { const s = lootSpr[o.t], b = Math.sin(time * 4 + o.x) * 1.5; ctx.drawImage(s.c, o.x - s.h, o.y - s.h + b, s.s, s.s); }

    // Rauch
    for (const p of parts) {
      if (!p.smoke || !inView(p.x, p.y)) continue;
      const f = p.life / p.max, r = p.r * (1.6 - f * 0.6);
      ctx.globalAlpha = f * 0.9; ctx.drawImage(smokeSpr(p.smoke), p.x - r, p.y - r, r * 2, r * 2);
    }
    ctx.globalAlpha = 1;

    // Gegner nach Höhe sortiert, Spieler dazwischen
    enemies.sort((a, b) => a.y - b.y);
    for (const e of enemies) if (inView(e.x, e.y)) ctx.drawImage(shadowSpr, e.x - e.r, e.y + e.r * 0.75 - e.r * 0.3, e.r * 2, e.r * 0.6);
    let pDrawn = false;
    for (const e of enemies) {
      if (!pDrawn && e.y > P.y) { drawPlayer(time); pDrawn = true; }
      if (!inView(e.x, e.y)) continue;
      // Kröten zeigen Sitzen oder Springen, sonst wechseln die Bilder mit der Animation
      const bh = e.d.beh || e.type;
      const fr = bh === 'toad' ? (e.st ? 1 : 0) : bh === 'toadking' ? (e.st === 2 ? 1 : 0) : (e.anim | 0) & 1;
      const s = e.d.spr[fr];
      const bob = (bh === 'shade' ? Math.sin(e.anim) * 2 : 0) - (e.hop || 0);
      const fa = e.fade === undefined ? 1 : Math.max(0.05, e.fade);
      ctx.setTransform(k * e.face, 0, 0, k, tx + e.x * k, ty + (e.y + bob) * k);
      ctx.globalAlpha = fa;
      ctx.drawImage(s.c, -s.h, -s.h, s.s, s.s);
      if (e.fl > 0) { ctx.globalAlpha = (e.d.boss ? 0.35 : 0.7) * fa; ctx.drawImage(s.w, -s.h, -s.h, s.s, s.s); }
      ctx.globalAlpha = 1;
      ctx.setTransform(k, 0, 0, k, tx, ty);
    }
    if (!pDrawn) drawPlayer(time);

    // Begleiter (das Irrlicht ist nur Licht und wird additiv gezeichnet)
    if (run) for (const p of run.pets) {
      const ps = PET[p.id];
      if (!ps.spr) continue;
      if (p.id === 'owl') ctx.drawImage(shadowSpr, p.x - 9, p.y + 30, 18, 6);
      else ctx.drawImage(shadowSpr, p.x - 11, p.y + 7, 22, 7);
      const s = ps.spr[(p.anim | 0) & 1], f = p.id === 'owl' ? 1 : p.face;
      ctx.setTransform(k * f, 0, 0, k, tx + p.x * k, ty + p.y * k);
      ctx.drawImage(s.c, -s.h, -s.h, s.s, s.s);
      ctx.setTransform(k, 0, 0, k, tx, ty);
    }

    // Motten im Menü umkreisen die Laterne
    menuMoths.length = 0;
    if (!run) {
      for (let i = 0; i < 3; i++) {
        const a = menuT * (1.3 + i * 0.4) + i * 2.1;
        const x = P.lx + Math.cos(a) * (26 + i * 10), y = P.ly - 8 + Math.sin(a * 1.7) * (16 + i * 6);
        menuMoths.push(x, y);
        const s = EN.moth.spr[((menuT * 16 + i * 3) | 0) & 1], f = Math.cos(a) > 0 ? -1 : 1;
        ctx.setTransform(k * f * 0.8, 0, 0, k * 0.8, tx + x * k, ty + y * k);
        ctx.drawImage(s.c, -s.h, -s.h, s.s, s.s);
      }
      ctx.setTransform(k, 0, 0, k, tx, ty);
    }
    const SPORE_C = { ice: '#bfeeff', dark: '#140308', moss: '#33401a', fire: '#ff7a2a', crystal: '#d8b8ff', sand: '#e8c27a', void: '#0a1a24' };
    for (const s of spores) if (inView(s.x, s.y)) { ctx.fillStyle = SPORE_C[s.k] || '#2a1238'; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill(); }

    // Lichtquellen sammeln
    let fade = 1;
    if (run && P.dead) fade = Math.max(0, 1 - run.deathT / 1.4);
    const fl = 1 + Math.sin(time * 9.7) * 0.02 + Math.sin(time * 23.1) * 0.015;
    light(P.lx, P.ly, P.light * fl * fade, 1);
    light(P.lx, P.ly, P.light * 1.9 * fade, 0.38);

  // Stufenaufstieg
  function rollChoices() {
    const pool = [];
    for (const id in ITEMS) {
      const lv = run.items[id] || 0;
      if (lv < ITEMS[id].max) pool.push({ id, w: lv > 0 ? 1.4 : ITEMS[id].kind === 'w' ? 1.1 : 1 });
    }
    const out = [], want = 3 + U('fourth');
    while (out.length < want && pool.length) {
      let r = Math.random() * pool.reduce((s, p) => s + p.w, 0), k = 0;
      while (k < pool.length - 1 && (r -= pool[k].w) > 0) k++;
      out.push(pool[k].id); pool.splice(k, 1);
    }
    if (!out.length) out.push('berries');
    return out;
  }

    return l;
  }
  // erst deine Liste, sonst die Standard-Reihenfolge (Waffen vor Talenten)
  function autoChoice(choices) {
    const mine = prioList().slice(0, prioSlots());
    return mine.find(x => choices.includes(x)) || DEFAULT_PRIO.find(x => choices.includes(x)) || choices[0];
  }

    const mine = prioList().slice(0, prioSlots());

    run.rerolls--; run.choices = rollChoices();
  }

  function updatePauseRemain() {

  // Beute einer Nacht; in der Arena wahlweise als Pokale (je 10 Bernstein = 1 Pokal, der Rest bleibt Bernstein)
  function nightEarn(won) {
    const arena = run.endless, t = arena ? run.t : Math.min(run.t, RUN_LEN), greed = (1 + 0.15 * U('greed')) * curWorld.reward;
    const drops = run.amber, timeB = Math.floor(t / 10), winB = won ? 80 : 0;
    const total = Math.round((drops + timeB + winB) * greed);
    const conv = arena && save.arenaConvert ? Math.floor(total / 10) : 0;
    // Arenapunkte: Zeit, besiegte Schatten, Bosse und Titanen
    const apGain = arena ? Math.round((Math.floor(t / 10) + Math.floor(run.kills / 50) + 5 * run.bossKills + run.ap) * (1 + 0.25 * U('arenaChamp')) * P.apMul) + conv : 0;

    const rec = arena ? t > (save.arenaBest || 0) + 0.5 : t > save.best + 0.5;
    save.amber += total - conv * 10; save.runs++; save.night = null;
    if (arena) { save.ap = (save.ap || 0) + apGain; if (t > (save.arenaBest || 0)) save.arenaBest = t; }
    E('overAp').hidden = !arena;

    const shards = run.shards + (won ? curWorld.shards + U('shardseeker') : 0);
    save.shards += shards;
    if (won) { save.wins++; save.worldWins[curWorld.id] = (save.worldWins[curWorld.id] || 0) + 1; }
