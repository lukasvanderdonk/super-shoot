        row.appendChild(makeBtn(T('newSlot'), 'btn small primary', () => { store.slots[i] = newSlot(); useSlot(i); }));
      }
      el.appendChild(row);
      box.appendChild(el);
    });
    E('exportCode').value = exportCode();
    E('importBtn').textContent = importArmed ? tf('importSure', { n: slotLabel(store.cur) }) : T('importBtn');
  }
  function useSlot(i) {
    store.cur = i; save = store.slots[i]; slotConfirm = -1; selNode = null;
    persist(); recalc(); renderSlots(); updateMenuMeta(); note(T('switched'));
  }
  function delSlot(i) {
    if (slotConfirm !== i) { slotConfirm = i; renderSlots(); return; }
    slotConfirm = -1;
    store.slots[i] = i === store.cur ? newSlot() : null;
    if (i === store.cur) { save = store.slots[i]; selNode = null; }
    persist(); recalc(); renderSlots(); updateMenuMeta(); note(T('deleted'));
  }
  // Speicher-Code: Spielstand ohne gespeicherte Nacht als Base64-Text
  function exportCode() {
    const bytes = new TextEncoder().encode(JSON.stringify({ ...save, night: null, played: 0 }));
    let bin = '';
    for (const b of bytes) bin += String.fromCharCode(b);
    return 'LN1-' + btoa(bin);
  }
  function parseCode(code) {
    try {
      const c = code.replace(/\s+/g, '');
      if (!c.startsWith('LN1-')) return null;
      const o = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(c.slice(4)), ch => ch.charCodeAt(0))));
      if (!o || typeof o.amber !== 'number' || typeof o.up !== 'object') return null;
      const up = {};
      for (const t of TREE) if (t.max && Number.isFinite(o.up[t.id])) up[t.id] = clamp(Math.floor(o.up[t.id]), 0, t.max);
      const comp = { fox: 1 }, worldWins = {};
      for (const id of COMP_IDS) if (o.comp && Number.isFinite(o.comp[id])) comp[id] = clamp(Math.floor(o.comp[id]), 0, 3);
      for (const w of WORLDS) if (o.worldWins && Number.isFinite(o.worldWins[w.id])) worldWins[w.id] = Math.max(0, o.worldWins[w.id] | 0);
      const compSel = Array.isArray(o.compSel) ? o.compSel.filter(id => COMPS[id]).slice(0, 2) : ['fox'];
      return {
        ...newSlot(String(o.name || '').slice(0, 20)), amber: Math.max(0, Math.floor(o.amber)), best: clamp(+o.best || 0, 0, RUN_LEN),
        wins: Math.max(0, o.wins | 0), runs: Math.max(0, o.runs | 0), up, shards: Math.max(0, o.shards | 0), comp, compSel, worldWins,
        ap: Math.max(0, o.ap | 0), arenaBest: Math.max(0, +o.arenaBest || 0),
        boons: Object.fromEntries(Object.entries(o.boons || {}).filter(([k, v]) => BOONS[k] && Number.isFinite(v)).map(([k, v]) => [k, Math.max(0, v | 0)])),
        arenaConvert: o.arenaConvert === true,
        titan: Object.assign(newSlot().titan, Object.fromEntries(['dmg', 'spd', 'rsp', 'hp'].filter(k => o.titan && Number.isFinite(o.titan[k])).map(k => [k, Math.max(0, o.titan[k] | 0)])), { on: !(o.titan && o.titan.on === false) }),
        auto: Object.fromEntries(Object.entries(o.auto || {}).filter(([, v]) => typeof v === 'boolean' || ['off', 'smart', 'always'].includes(v))),
        ...(Array.isArray(o.prio) ? { prio: o.prio.filter(id => ITEMS[id]) } : {}),
        world: WORLDS.some(w => w.id === o.world) ? o.world : 'wald',
      };
    } catch (e) { return null; }
  }
  // ---------- Welten-Auswahl ----------
  function openWorlds() { state = 'worlds'; renderWorlds(); showScreen('worldScr'); }
  function renderWorlds() {
    const box = E('worldList');
    box.innerHTML = '';

      if (w.dmg > 1) chips.push(tf('wDmg', { n: Math.round((w.dmg - 1) * 100) }));
      if (w.spawn > 1) chips.push(tf('wSpawn', { n: Math.round((w.spawn - 1) * 100) }));
      if (w.speed > 1) chips.push(tf('wSpeed', { n: Math.round((w.speed - 1) * 100) }));

        `<h3>${w.name[lang]}</h3><p>${w.d[lang]}</p><div class="chips">${chips.map(c => `<span>${c}</span>`).join('')}</div>`;
      const row = document.createElement('div');
      row.className = 'row';
      if (!open) row.innerHTML = `<span class="ni-need">${w.endless ? T('arenaLocked') : tf('wLocked', { n: WORLDS.find(x => x.id === w.prev).name[lang] })}</span>`;
      else if (cur) row.innerHTML = `<span class="ni-tag">${T('chosen')}</span>`;
      else row.appendChild(makeBtn(T('choose'), 'btn small primary', () => { save.world = w.id; persist(); setWorld(w.id); renderWorlds(); updateMenuMeta(); }));
      if (w.endless && open) {

  // ---------- Arena-Titan einstellen ----------
  const TITAN_UI = { dmg: 'crit', spd: 'wind', rsp: 'hourglass', hp: 'heart' };
  function openTitan() { state = 'titan'; renderTitan(); showScreen('titanScr'); }
  function titanEffect(k, lv) {
    if (k === 'dmg') return tf('tDmgV', { n: Math.round((titanDmg(lv) - 1) * 100) });
    if (k === 'spd') return tf('tSpdV', { n: fmtNum(+titanSpd(lv).toFixed(2)) });
    if (k === 'rsp') return tf('tRspV', { n: Math.round(titanResp(lv)) });
    return tf('tHpV', { n: fmtNum(titanHp(lv)) });
  }
  function renderTitan() {
    const box = E('titanList'), t = save.titan;

  // ---------- Begleiter-Auswahl ----------
  function openComps() { state = 'comps'; renderComps(); showScreen('compScr'); }
  function renderComps() {
    const box = E('compList');
    box.innerHTML = '';
    E('compShards').textContent = save.shards;
    E('compCount').textContent = tf('compCount', { a: save.compSel.length, b: compMax() });
    for (const id of COMP_IDS) {
      const c = COMPS[id], lv = save.comp[id] || 0, on = save.compSel.includes(id);
      const el = document.createElement('div');
      el.className = 'wcard' + (on ? ' cur' : '') + (lv ? '' : ' locked');
      el.style.setProperty('--c', c.c);
      const pips = `<span class="pips">${'<i class="on"></i>'.repeat(lv)}${'<i></i>'.repeat(3 - lv)}</span>`;
      el.innerHTML = `<div class="comp-head"><span class="comp-ico">${icon(c.icon)}</span><div><h3>${c.name[lang]}</h3>${pips}</div></div>` +
        `<p>${c.d[lang]}</p><p class="ni-tag">${lv ? `${tf('compLv', { n: lv })}: ${c.lv[lang][lv - 1]}` : c.lv[lang][0]}</p>`;
      const row = document.createElement('div');

        b.insertAdjacentHTML('beforeend', icon('shard'));

      }
      if (lv) row.appendChild(makeBtn(on ? `${T('taken')} ✓` : T('take'), 'btn small' + (on ? ' on' : ''), () => toggleComp(id)));
      el.appendChild(row);
      box.appendChild(el);
    }
  }
  function buyComp(id) {
    const c = COMPS[id], lv = save.comp[id] || 0;
    if (lv >= 3 || save.shards < c.cost[lv]) return;
    save.shards -= c.cost[lv]; save.comp[id] = lv + 1;
    // frisch freigeschaltet: gleich mitnehmen, wenn Platz ist
    if (!lv && save.compSel.length < compMax()) save.compSel.push(id);
    persist(); Snd.play('amber'); renderComps(); updateMenuMeta();
  }
  function toggleComp(id) {
    const sel = save.compSel, i = sel.indexOf(id);
    if (i >= 0) sel.splice(i, 1);
    else { sel.push(id); while (sel.length > compMax()) sel.shift(); }
    persist(); renderComps(); updateMenuMeta();
  }
  function backToMenu() { state = 'menu'; showScreen('menu'); updateMenuMeta(); }

  function doImport() {
    const s = parseCode(E('importCode').value);
    if (!s) { importArmed = false; renderSlots(); note(T('badCode'), true); return; }
    if (!importArmed) { importArmed = true; renderSlots(); note(tf('importWarn', { n: slotLabel(store.cur) })); return; }
    importArmed = false;
    store.slots[store.cur] = s; save = s; selNode = null;
    persist(); recalc(); E('importCode').value = '';
    renderSlots(); updateMenuMeta(); note(T('imported'));
  }

  function updateMenuMeta() {
    E('bestVal').textContent = save.best > 0 ? fmtClock(save.best) : T('noBest');
    E('winsVal').textContent = save.wins > 0 ? tf('wins', { n: save.wins }) : '';
    E('winsVal').hidden = save.wins <= 0;
    E('amberVal').textContent = save.amber;
    E('slotName').textContent = slotLabel(store.cur);
    if (!run) setWorld(save.world);
    const w = WORLDS.find(x => x.id === save.world) || WORLDS[0];
    E('worldName').textContent = w.name[lang];
    E('compName').textContent = save.compSel.length ? save.compSel.map(id => COMPS[id].name[lang]).join(' + ') : T('none');
    E('shardVal').textContent = save.shards;
    E('apVal').textContent = save.ap || 0;
    E('apWrap').hidden = !(save.ap || U('arena'));
    document.querySelector('.title-card .eyebrow').textContent = tf('eyebrowW', { w: w.name[lang] });
    // gespeicherte Nacht: „Fortsetzen“ wird zum Hauptknopf

    E('contBtn').hidden = !n;
    if (n) E('contBtn').textContent = tf('cont', { c: fmtClock(n.run.t) });
    E('playBtn').textContent = T(n ? 'newNight' : 'play');
    E('playBtn').classList.toggle('primary', !n);
  }
  function updateToggles() {
    const m = `${T('music')}: ${store.music ? T('on') : T('off')}`, s = `${T('sound')}: ${store.sfx ? T('on') : T('off')}`;
    for (const id of ['musBtn', 'musBtn2']) { E(id).textContent = m; E(id).setAttribute('aria-pressed', String(store.music)); }
    for (const id of ['sfxBtn', 'sfxBtn2']) { E(id).textContent = s; E(id).setAttribute('aria-pressed', String(store.sfx)); }
    E('langBtn').textContent = T('langBtn');

  }
  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-t]').forEach(el => { el.textContent = T(el.dataset.t); });
    E('kStar').textContent = T(matchMedia('(hover: none)').matches ? 'kTap' : 'kClick');
    E('abDash').setAttribute('aria-label', NODE.dash.name[lang]);
    E('abBeacon').setAttribute('aria-label', NODE.beacon.name[lang]);
    E('abStar').title = NODE.starguide.name[lang];
    updateToggles(); updateMenuMeta();
  }

  // ---------- Ereignisse ----------
  // Nur eine Spiel-Instanz pro Fenster. Spielt der Artifact-Viewer eine neue Version ein,
  // hört die alte ganz auf (sonst liefen zwei Uhren und zwei Spiele gleichzeitig).
  const life = new AbortController(), sig = { signal: life.signal };
  let stopped = false;
  try { if (typeof window.__lnStop === 'function') window.__lnStop(); } catch (e) { /* alte Instanz schon weg */ }
  window.__lnStop = () => {
    stopped = true; life.abort(); clearInterval(Music.timer); Music.on = false;
    if (Snd.ctx) Snd.ctx.close().catch(() => {});
  };
  document.querySelectorAll('[data-ico]').forEach(el => el.insertAdjacentHTML('afterbegin', icon(el.dataset.ico)));
  const on = (id, fn) => E(id).addEventListener('click', () => { Snd.init(); Snd.play('click'); fn(); }, sig);
  on('playBtn', startRun);
  on('contBtn', resumeNight);
  on('shopBtn', () => openShop('menu'));
  on('shopBack', closeShop);
  on('slotsBtn', openSlots);
  on('slotsBack', closeSlots);
  on('worldsBtn', openWorlds);
  on('worldBack', backToMenu);
  on('titanBack', openWorlds);
  on('titanOn', () => { save.titan.on = !save.titan.on; persist(); renderTitan(); });
  on('compBtn', openComps);
  on('compBack', backToMenu);
  on('prioBack', closePrio);
  on('prioBtn2', () => openPrio('pause'));
  // Spieltempo: 1× → 1,5× → 2×
  const toggleTempo = () => { store.tempo = { 1: 1.5, 1.5: 2 }[store.tempo || 1] || 1; persist(); updateToggles(); updatePauseRemain(); };
  on('tempoBtn', toggleTempo); on('tempoBtn2', toggleTempo);
  on('importBtn', doImport);
  E('importCode').addEventListener('input', () => { if (importArmed) { importArmed = false; renderSlots(); note(''); } }, sig);
  E('copyBtn').addEventListener('click', () => {
    const ta = E('exportCode');
    const manual = () => { ta.focus(); ta.select(); note(T('copyManual')); };
    try { navigator.clipboard.writeText(ta.value).then(() => note(T('copied')), manual); } catch (e) { manual(); }
  }, sig);
  on('pauseBtn', pause);
  on('resumeBtn', resume);
  on('saveQuitBtn', () => { saveNight(); Platform.gameplayStop(); toMenu(); });
  on('quitBtn', () => endRun(false));
  // Fähigkeiten per Knopf (pointerdown reagiert auf dem Handy sofort)
  for (const [id, fn] of [['abDash', () => doDash()], ['abBeacon', () => doBeacon()], ['abSlow', () => doSlow()], ['abGale', () => doGale()]]) {
    E(id).addEventListener('pointerdown', e => { e.preventDefault(); fn(); }, sig);
    E(id).addEventListener('click', fn, sig);
  }
  // Sternkarte: anklicken wählt einen Stern, mit der Maus ziehen verschiebt die Karte
  E('tree').addEventListener('click', e => {
    const b = e.target.closest('.node');
    if (!b || treeMoved) return;
    selNode = b.dataset.id; Snd.play('click');
    E('tree').querySelectorAll('.node.sel').forEach(n => n.classList.remove('sel'));
    b.classList.add('sel');
    renderNodeInfo();
  }, sig);
  E('treeWrap').addEventListener('pointerdown', e => {
    if (e.pointerType !== 'mouse' || e.button !== 0) return;
    const w = E('treeWrap');
    treeDrag = { x: e.clientX, y: e.clientY, l: w.scrollLeft, t: w.scrollTop }; treeMoved = false;
  }, sig);
  addEventListener('pointermove', e => {
    if (!treeDrag) return;
    const w = E('treeWrap'), dx = e.clientX - treeDrag.x, dy = e.clientY - treeDrag.y;
    if (!treeMoved && Math.hypot(dx, dy) > 5) { treeMoved = true; w.classList.add('dragging'); }
    if (treeMoved) { w.scrollLeft = treeDrag.l - dx; w.scrollTop = treeDrag.t - dy; }
  }, sig);
  addEventListener('pointerup', () => {
    if (!treeDrag) return;
    treeDrag = null; E('treeWrap').classList.remove('dragging');
    setTimeout(() => { treeMoved = false; }, 0);
  }, sig);
  on('againBtn', () => Platform.breakAd(startRun));
  on('overShop', () => openShop('over'));
  on('overMenu', toMenu);
  on('rerollBtn', reroll);
  const toggleMusic = () => { store.music = !store.music; persist(); Snd.applyVolumes(); updateToggles(); };
  const toggleSfx = () => { store.sfx = !store.sfx; persist(); Snd.applyVolumes(); updateToggles(); };
  on('musBtn', toggleMusic); on('musBtn2', toggleMusic);
  on('sfxBtn', toggleSfx); on('sfxBtn2', toggleSfx);
  on('langBtn', () => { lang = lang === 'de' ? 'en' : 'de'; store.lang = lang; persist(); applyLang(); });

  // Ton erst nach der ersten Berührung (Browser-Regel)
  const firstGesture = () => { Snd.init(); Music.start(); };
  addEventListener('pointerdown', firstGesture, { once: true, signal: life.signal });
  addEventListener('keydown', firstGesture, { once: true, signal: life.signal });

  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (state === 'play' && k.startsWith('arrow')) e.preventDefault();
    keys[k] = true;
    if (k === 'escape' || k === 'p') { if (state === 'play') pause(); else if (state === 'pause') resume(); }
    if (state === 'play') {
      if (k === ' ' || k === 'shift') { e.preventDefault(); doDash(); }
      if (k === 'e') doBeacon();
      if (k === 'q') doSlow();
      if (k === 'f') doGale();
    }
    if (state === 'levelup') {
      if (k >= '1' && k <= '4' && run.choices[+k - 1]) pick(run.choices[+k - 1]);
      if (k === 'r') reroll();
    }
  }, sig);
  addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; }, sig);
  addEventListener('blur', () => { for (const k in keys) keys[k] = false; pause(); }, sig);
  // beim Verlassen der Seite die laufende Nacht still sichern
  const autoSave = () => { if (run && (state === 'play' || state === 'pause' || state === 'levelup')) saveNight(true); };
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { autoSave(); pause(); if (Snd.ctx) Snd.ctx.suspend().catch(() => {}); }
    else if (Snd.ctx) Snd.ctx.resume().catch(() => {});
  }, sig);
  addEventListener('pagehide', autoSave, sig);

  // Maus: Klick lenkt die Sterne. Finger: ziehen = laufen, kurz tippen = Sterne lenken.
  const taps = new Map();
  cv.addEventListener('pointerdown', e => {
    if (state !== 'play') return;
    if (e.pointerType === 'mouse') { if (e.button === 0) starClick(e.clientX, e.clientY); return; }
    taps.set(e.pointerId, { x: e.clientX, y: e.clientY, t: performance.now(), moved: false });
    if (!joy.active) { joy.active = true; joy.id = e.pointerId; joy.ox = e.clientX; joy.oy = e.clientY; joy.dx = joy.dy = 0; }
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* egal */ }
  }, sig);
  cv.addEventListener('pointermove', e => {
    const tp = taps.get(e.pointerId);
    if (tp && Math.hypot(e.clientX - tp.x, e.clientY - tp.y) > 14) tp.moved = true;
    if (!joy.active || e.pointerId !== joy.id) return;
    const R = 56;
    let dx = e.clientX - joy.ox, dy = e.clientY - joy.oy;
    const d = Math.hypot(dx, dy);
    if (d > R) { joy.ox += dx * (1 - R / d); joy.oy += dy * (1 - R / d); dx = e.clientX - joy.ox; dy = e.clientY - joy.oy; }
    joy.dx = d < 6 ? 0 : dx / R; joy.dy = d < 6 ? 0 : dy / R;
  }, sig);
  const endJoy = e => {
    const tp = taps.get(e.pointerId);
    taps.delete(e.pointerId);
    if (tp && !tp.moved && e.type === 'pointerup' && performance.now() - tp.t < 300) starClick(tp.x, tp.y);
    if (e.pointerId === joy.id) { joy.active = false; joy.dx = joy.dy = 0; }
  };
  cv.addEventListener('pointerup', endJoy, sig);
  cv.addEventListener('pointercancel', endJoy, sig);
  cv.addEventListener('contextmenu', e => e.preventDefault(), sig);
  addEventListener('resize', () => { resize(); if (state === 'shop') renderShop(); }, sig);

  // ---------- Hauptschleife ----------
  let last = performance.now(), slow = 0;
  function frame(now) {
    if (stopped) return;   // eine neuere Version hat übernommen
    const raw = (now - last) / 1000;
    last = now;
    const dt = Math.min(0.05, raw);
    if (state === 'play' && !lowQ && (window.devicePixelRatio || 1) > 1) {
      slow = raw > 0.026 ? slow + 1 : Math.max(0, slow - 0.5);
      if (slow > 120) { lowQ = true; resize(); }
    }
    if (state === 'play') {
      // Spieltempo in Teilschritte zerlegen, damit nichts durch Gegner hindurchfliegt
      const ts = (store.tempo || 1) * dbg.speed, n = Math.ceil(ts);
      for (let i = 0; i < n && state === 'play'; i++) step((dt * ts) / n);
    }
    else if (!run) menuStep(dt);
    // automatische Gabenwahl: nach kurzer Zeit die leuchtende Karte nehmen
    if (state === 'levelup' && run && run.autoPick && (run.autoPick.t -= dt) <= 0) { const id = run.autoPick.id; run.lvLock = 0; pick(id); }
    shakeAmt = Math.max(0, shakeAmt - dt * 22);
    render(now / 1000);
    requestAnimationFrame(frame);
  }

  let booted = false;
  function boot(data) {
    if (booted) return;   // nie eine zweite Hauptschleife starten
    booted = true;
    if (!storageOk && data && data.store) {
      store = data.store; fixStore(); save = store.slots[store.cur];
      if (store.lang) lang = store.lang;
    }
    resize(); recalc(); applyLang(); showScreen('menu');
    // Nach einem Update im Artifact-Viewer geht die Nacht genau dort weiter, wo sie war (pausiert)
    if (data && data.live && data.live.run) { save.night = data.live; resumeNight(); pause(); }
    requestAnimationFrame(t => { last = t; frame(t); });
  }
  // Schnappschuss für den Artifact-Viewer: Spielstände plus die gerade laufende Nacht
  try {
    window.claude?.hot?.snapshot?.(() => ({ store, live: run && !P.dead && !run.won && state !== 'over' ? packNight() : null }));
  } catch (e) { /* nur im Artifact-Viewer */ }
  if (window.claude?.hot?.ready) window.claude.hot.ready(boot);
  else boot(window.claude?.hot?.data ?? {});

  window.__ln = {
    dbg, P, get state() { return state; }, get run() { return run; }, get enemies() { return enemies; }, get gems() { return gems; }, get spores() { return spores; },
    get store() { return store; }, get stars() { return stars; }, get zones() { return zones; }, get loot() { return loot; }, TREE, WORLDS, starClick, doDash, doBeacon, saveNight,
    // Spielzeit ohne Animation vorspulen (für Tests); dbg.autoPick wählt bei Stufenaufstieg die erste Karte
    sim(sec) {
      for (let i = 0; i < sec * 60; i++) {
        while (state === 'levelup' && dbg.autoPick) { run.lvLock = 0; pick(typeof dbg.autoPick === 'function' ? dbg.autoPick(run.choices) : run.choices[0]); }
        if (state !== 'play') break;
        if (dbg.steer) dbg.steer();
        step(1 / 60);
      }
      render(performance.now() / 1000);
      return run && { state, t: Math.round(run.t), lv: run.lv, hp: Math.round(P.hp), kills: run.kills, en: enemies.length, items: { ...run.items } };
    },
  };
})();
</script>
