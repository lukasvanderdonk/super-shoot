<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lantern Night</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Halte deine Laterne bis zum Morgengrauen am Brennen – ein Survivors-Spiel im nächtlichen Wald.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700;800&family=Barlow+Semi+Condensed:wght@500;700&family=Grenze+Gotisch:wght@600;800&display=swap">
<style>
/* Vollbild-Nachtwald auf dem Canvas; Menü als Titelkarte unten links, Dialoge mittig über der abgedunkelten Szene */
:root {
  --night: #0a0e1b;
  --ink: #efe6cf;
  --ink-dim: #a8a190;
  --amber: #ffb84d;
  --ember: #ff6a4a;
  --moon: #9fd0ff;
  --lilac: #b99cff;
  --line: rgba(255, 184, 77, .32);
  --panel: rgba(13, 17, 31, .92);
  --f-display: "Grenze Gotisch", "Palatino Linotype", Georgia, serif;
  --f-body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-num: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; background: var(--night); color: var(--ink); }
body { font-family: var(--f-body); font-size: 16px; line-height: 1.4; -webkit-tap-highlight-color: transparent; }
#game { position: fixed; inset: 0; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* Bildschirme */
.screen {
  position: absolute; inset: 0; display: flex; overflow-y: auto;
  padding-top: max(20px, env(safe-area-inset-top, 0px));
  padding-bottom: max(20px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.screen.dim { background: rgba(4, 6, 14, .68); }
#menu { align-items: flex-end; background: linear-gradient(90deg, rgba(4, 6, 14, .85) 0%, rgba(4, 6, 14, .4) 42%, rgba(4, 6, 14, 0) 68%); }
@media (max-width: 760px) {
  #menu { background: linear-gradient(0deg, rgba(4, 6, 14, .94) 0%, rgba(4, 6, 14, .6) 52%, rgba(4, 6, 14, 0) 78%); }
}
.title-card { width: min(31rem, 100%); display: flex; flex-direction: column; gap: 16px; margin-left: clamp(0px, 5vw, 72px); margin-bottom: clamp(0px, 5vh, 56px); }
.eyebrow { margin: 0; font-family: var(--f-num); font-weight: 700; font-size: .82rem; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); }
h1 {
  margin: 0; font-family: var(--f-display); font-weight: 800; font-size: clamp(3.6rem, 12vw, 7.4rem); line-height: .82;
  color: var(--amber); text-shadow: 0 0 28px rgba(255, 168, 60, .5), 0 0 2px rgba(255, 220, 160, .6); text-wrap: balance;
}
h2 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: clamp(2.1rem, 6vw, 3.1rem); line-height: .95; text-wrap: balance; }
.tag { margin: 0; font-size: 1.15rem; max-width: 26em; }
.menu-btns, .row { display: flex; flex-wrap: wrap; gap: 10px; }
.col { display: flex; flex-direction: column; gap: 10px; }
.menu-meta { display: flex; flex-wrap: wrap; gap: 6px 20px; font-family: var(--f-num); font-size: 1.02rem; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.menu-meta b { color: var(--ink); font-weight: 700; }
.menu-meta .amb { display: inline-flex; align-items: center; gap: 5px; color: var(--amber); font-weight: 700; }
.menu-meta svg { width: 16px; height: 16px; }
.hint { margin: 0; font-size: .92rem; color: var(--ink-dim); max-width: 30em; }

/* Knöpfe */
.btn {
  appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 20px;
  border: 1px solid var(--line); border-radius: 6px; background: rgba(21, 27, 46, .8); color: var(--ink);
  font: 700 1.05rem/1.1 var(--f-body); letter-spacing: .01em; cursor: pointer; transition: border-color .15s, background-color .15s, box-shadow .15s;
}
.btn:hover { border-color: var(--amber); background: rgba(40, 37, 46, .92); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .42; cursor: default; transform: none; border-color: var(--line); background: rgba(21, 27, 46, .8); }
.btn.primary { background: var(--amber); border-color: var(--amber); color: #1d1405; box-shadow: 0 0 24px rgba(255, 184, 77, .35); }
.btn.primary:hover { background: #ffc872; }
.btn.small { min-height: 38px; padding: 6px 14px; font-size: .95rem; font-weight: 500; }
.btn svg { width: 18px; height: 18px; }
:focus-visible { outline: 2px solid var(--moon); outline-offset: 3px; }
.ico .f { fill: currentColor; }
.ico .s { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* Tafeln */
.panel { width: min(760px, 100%); margin: auto; display: flex; flex-direction: column; gap: 16px; padding: 24px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); box-shadow: 0 20px 60px rgba(0, 0, 0, .5); }
.panel.narrow { width: min(360px, 100%); }
.sub { margin: 0; color: var(--ink-dim); max-width: 60ch; }

/* Stufenaufstieg */
.lv-wrap { width: min(1000px, 100%); margin: auto; display: flex; flex-direction: column; gap: 14px; }
.lv-head { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 6px 16px; }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 760px) { .cards { grid-template-columns: minmax(0, 1fr); } }
.card {
  position: relative; display: flex; gap: 14px; align-items: flex-start; min-height: 128px; padding: 18px 16px; text-align: left;
  border: 1px solid var(--line); border-radius: 8px; background: linear-gradient(180deg, rgba(30, 32, 52, .97), rgba(14, 18, 32, .97));
  color: var(--ink); font: inherit; cursor: pointer; transition: border-color .15s, box-shadow .15s; animation: cardIn .28s ease-out both;
}
.card:nth-child(2) { animation-delay: .05s; }
.card:nth-child(3) { animation-delay: .1s; }
@keyframes cardIn { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
.card:hover, .card:focus-visible { border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber), 0 0 32px rgba(255, 184, 77, .22); }
.card.locked { pointer-events: none; }
.card > .ico { flex: none; width: 46px; height: 46px; padding: 9px; border-radius: 50%; background: rgba(255, 184, 77, .13); color: var(--amber); }
.card.pas > .ico { background: rgba(159, 208, 255, .13); color: var(--moon); }
.c-body { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.c-name { font-weight: 800; font-size: 1.18rem; }
.c-lv { font-family: var(--f-num); font-size: .9rem; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.c-new { align-self: flex-start; font-family: var(--f-num); font-weight: 700; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; padding: 1px 7px; border-radius: 3px; background: var(--moon); color: var(--night); }
.c-desc { margin-top: 4px; line-height: 1.35; }
.card kbd { position: absolute; top: 10px; right: 12px; font-family: var(--f-num); font-size: .8rem; color: var(--ink-dim); border: 1px solid rgba(239, 230, 207, .22); border-radius: 4px; padding: 0 6px; }
@media (hover: none) { .card kbd { display: none; } }

/* Werkstatt */
.shop-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px 16px; }
.purse { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-num); font-weight: 700; font-size: 1.5rem; color: var(--amber); font-variant-numeric: tabular-nums; }
.purse svg { width: 22px; height: 22px; }
.shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 10px; }
.up { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid rgba(239, 230, 207, .12); border-radius: 8px; background: rgba(255, 255, 255, .03); }
.up > .ico { flex: none; width: 40px; height: 40px; padding: 8px; border-radius: 50%; background: rgba(255, 184, 77, .13); color: var(--amber); }
.up-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.up h3 { margin: 0; font-size: 1.05rem; }
.up p { margin: 0; font-size: .92rem; color: var(--ink-dim); }
.pips { display: flex; gap: 4px; margin-top: 4px; }
.pips i { width: 14px; height: 4px; border-radius: 2px; background: rgba(239, 230, 207, .18); }
.pips i.on { background: var(--amber); }
.buy { flex: none; min-width: 84px; font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.buy svg { color: var(--amber); }

/* Ende einer Nacht */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 0; }
.stats div { padding: 12px; border-radius: 8px; background: rgba(255, 255, 255, .04); min-width: 0; }
.stats dt { font-family: var(--f-num); font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim); }
.stats dd { margin: 2px 0 0; font-family: var(--f-num); font-weight: 700; font-size: 1.8rem; font-variant-numeric: tabular-nums; }
@media (max-width: 520px) {
  .stats { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .stats div { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 8px 12px; }
  .stats dd { margin: 0; font-size: 1.4rem; }
}
.earn { margin: 0; display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; font-family: var(--f-num); font-weight: 700; font-size: 1.5rem; color: var(--amber); }
.earn svg { width: 22px; height: 22px; }
.earn small { font-size: .95rem; font-weight: 500; color: var(--ink-dim); }
.rec { color: var(--moon); }

/* Anzeige im Spiel */
#hud { position: absolute; inset: 0; pointer-events: none; }
.xp { position: absolute; left: 0; right: 0; top: 0; height: calc(6px + env(safe-area-inset-top, 0px)); background: rgba(4, 6, 14, .65); }
.xp i { position: absolute; left: 0; bottom: 0; height: 6px; width: 0; background: linear-gradient(90deg, #6aa8ff, var(--moon)); box-shadow: 0 0 10px var(--moon); }
.hud-top {
  position: absolute; top: calc(14px + env(safe-area-inset-top, 0px));
  left: max(14px, env(safe-area-inset-left, 0px)); right: max(14px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: start; gap: 10px;
}
.hp { position: relative; width: min(220px, 100%); height: 18px; border-radius: 4px; background: rgba(4, 6, 14, .72); border: 1px solid rgba(255, 106, 74, .5); overflow: hidden; }
.hp i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: linear-gradient(90deg, #b8392a, var(--ember)); }
#hpTxt { position: relative; display: block; padding-left: 7px; font-family: var(--f-num); font-weight: 700; font-size: .8rem; line-height: 16px; font-variant-numeric: tabular-nums; }
.lvl { margin-top: 6px; font-family: var(--f-num); font-weight: 700; font-size: .95rem; color: var(--moon); text-shadow: 0 1px 6px rgba(0, 0, 0, .8); }
.inv { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; max-width: 250px; }
.inv span { position: relative; width: 26px; height: 26px; border-radius: 5px; background: rgba(4, 6, 14, .66); display: grid; place-items: center; color: var(--amber); }
.inv span.p { color: var(--moon); }
.inv svg { width: 16px; height: 16px; }
.inv b { position: absolute; right: -3px; bottom: -5px; font-family: var(--f-num); font-size: .66rem; color: var(--ink); }
.hud-mid { display: flex; flex-direction: column; align-items: center; gap: 4px; }
#clock { font-family: var(--f-num); font-weight: 700; font-size: 1.7rem; line-height: 1; letter-spacing: .04em; font-variant-numeric: tabular-nums; text-shadow: 0 1px 10px rgba(0, 0, 0, .9); }
#boss { display: flex; flex-direction: column; align-items: center; gap: 3px; font-family: var(--f-display); font-size: 1.1rem; color: #dccdff; text-shadow: 0 1px 6px #000; }
.bossbar { width: min(340px, 52vw); height: 8px; border-radius: 3px; background: rgba(4, 6, 14, .72); border: 1px solid rgba(185, 156, 255, .55); overflow: hidden; }
.bossbar i { display: block; height: 100%; width: 100%; background: var(--lilac); }
.hud-right { justify-self: end; display: flex; align-items: center; gap: 12px; font-family: var(--f-num); font-weight: 700; font-size: 1.1rem; font-variant-numeric: tabular-nums; text-shadow: 0 1px 6px rgba(0, 0, 0, .9); }
.stat { display: inline-flex; align-items: center; gap: 5px; }
.stat svg { width: 18px; height: 18px; }
.stat.kills svg { color: #ff7c95; }
.stat.amb svg { color: var(--amber); }
#pauseBtn { pointer-events: auto; width: 42px; min-height: 42px; padding: 0; }
@media (max-width: 520px) {
  .stat.kills { display: none; }
  #clock { font-size: 1.35rem; }
  .inv span { width: 22px; height: 22px; }
  .inv svg { width: 14px; height: 14px; }
}
#banner {
  position: absolute; left: 0; right: 0; top: 28%; padding-left: 16px; padding-right: 16px; text-align: center;
  font-family: var(--f-display); font-weight: 800; font-size: clamp(1.8rem, 6vw, 3rem); color: var(--amber);
  text-shadow: 0 0 22px rgba(255, 168, 60, .55), 0 2px 8px #000; opacity: 0; transition: opacity .4s;
}
#banner.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) {
  .card { animation: none; }
  #banner { transition: none; }
}
</style>
</head>
<body>
<div id="game">
  <canvas id="cv"></canvas>

  <div id="hud" hidden>
    <div class="xp"><i id="xpFill"></i></div>
    <div class="hud-top">
      <div>
        <div class="hp"><i id="hpFill"></i><span id="hpTxt">100 / 100</span></div>
        <div class="lvl" id="lvTxt"></div>
        <div class="inv" id="inv"></div>
      </div>
      <div class="hud-mid">
        <div id="clock">22:00</div>
        <div id="boss" hidden><span id="bossName"></span><div class="bossbar"><i id="bossFill"></i></div></div>
      </div>
      <div class="hud-right">
        <span class="stat kills" data-ico="eyes"><b id="killTxt">0</b></span>
        <span class="stat amb" data-ico="amber"><b id="amberTxt">0</b></span>
        <button class="btn" id="pauseBtn" type="button" aria-label="Pause"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" class="f"/><rect x="14" y="5" width="4" height="14" rx="1" class="f"/></svg></button>
      </div>
    </div>
    <div id="banner" aria-live="polite"></div>
  </div>

  <section id="menu" class="screen">
    <div class="title-card">
      <p class="eyebrow" data-t="eyebrow"></p>
      <h1>Lantern<br>Night</h1>
      <p class="tag" data-t="tagline"></p>
      <div class="menu-btns">
        <button class="btn primary" id="playBtn" type="button" data-t="play"></button>
        <button class="btn" id="shopBtn" type="button" data-t="workshop"></button>
      </div>
      <div class="menu-meta">
        <span><span data-t="best"></span>: <b id="bestVal"></b></span>
        <span id="winsVal"></span>
        <span class="amb" data-ico="amber"><span id="amberVal">0</span></span>
      </div>
      <div class="row">
        <button class="btn small" id="musBtn" type="button"></button>
        <button class="btn small" id="sfxBtn" type="button"></button>
        <button class="btn small" id="langBtn" type="button"></button>
      </div>
      <p class="hint" data-t="hint"></p>
    </div>
  </section>

  <section id="shop" class="screen dim" hidden>
    <div class="panel">
      <div class="shop-head">
        <h2 data-t="workshop"></h2>
        <span class="purse" data-ico="amber"><span id="shopAmber">0</span></span>
      </div>
      <p class="sub" data-t="wsSub"></p>
      <div class="shop-grid" id="shopGrid"></div>
      <div class="row"><button class="btn" id="shopBack" type="button" data-t="back"></button></div>
    </div>
  </section>

  <section id="lvl" class="screen dim" hidden>
    <div class="lv-wrap">
      <div class="lv-head">
        <h2 id="lvTitle"></h2>
        <p class="sub" data-t="lvSub"></p>
      </div>
      <div class="cards" id="cards"></div>
      <div class="row"><button class="btn small" id="rerollBtn" type="button"></button></div>
    </div>
  </section>

  <section id="pause" class="screen dim" hidden>
    <div class="panel narrow">
      <h2 data-t="paused"></h2>
      <div class="col">
        <button class="btn primary" id="resumeBtn" type="button" data-t="resume"></button>
        <button class="btn small" id="musBtn2" type="button"></button>
        <button class="btn small" id="sfxBtn2" type="button"></button>
        <button class="btn small" id="quitBtn" type="button" data-t="giveUp"></button>
      </div>
    </div>
  </section>

  <section id="over" class="screen dim" hidden>
    <div class="panel">
      <p class="eyebrow rec" id="overRec" data-t="record" hidden></p>
      <h2 id="overTitle"></h2>
      <p class="sub" id="overSub"></p>
      <dl class="stats">
        <div><dt data-t="survived"></dt><dd id="stTime">22:00</dd></div>
        <div><dt data-t="defeated"></dt><dd id="stKills">0</dd></div>
        <div><dt data-t="reached"></dt><dd id="stLv">1</dd></div>
      </dl>
      <p class="earn" id="overEarn"></p>
      <div class="row">
        <button class="btn primary" id="againBtn" type="button" data-t="again"></button>
        <button class="btn" id="overShop" type="button" data-t="workshop"></button>
        <button class="btn" id="overMenu" type="button" data-t="menu"></button>
      </div>
    </div>
  </section>
</div>

<script>
'use strict';
(() => {
  const $ = id => document.getElementById(id);
  const TAU = Math.PI * 2;
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const RUN_LEN = 480;   // 8 Minuten Spielzeit = 22:00 bis 6:00 Uhr
  const MAXE = 320;      // höchstens so viele Gegner gleichzeitig

  // Plattform-Anbindung: Bei CrazyGames, Poki o. ä. hier deren SDK aufrufen
  // (Spielstart/-stopp melden, Werbung zwischen zwei Nächten). Ohne SDK passiert nichts.
  const Platform = {
    gameplayStart() {},
    gameplayStop() {},
    breakAd(done) { done(); },
  };

  // Zum Testen: __ln.speed > 1 lässt die Zeit schneller laufen, __ln.input steuert den Spieler
  const dbg = { speed: 1, input: null };

  // ---------- Spielstand ----------
  const SAVE_KEY = 'lantern-night-v1';
  const defaultSave = () => ({ amber: 0, best: 0, wins: 0, runs: 0, up: {}, music: true, sfx: true, lang: null });
  let save = defaultSave();
  let storageOk = false;
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) { save = Object.assign(defaultSave(), JSON.parse(raw)); storageOk = true; }
  } catch (e) { /* kein Speicher verfügbar */ }
  function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* egal */ } }

  // ---------- Texte ----------
  const STR = {
    de: {
      eyebrow: 'Eine Nacht im Wald · 22:00 bis 6:00 Uhr',
      tagline: 'Halte deine Laterne bis zum Morgengrauen am Brennen. Je dunkler die Nacht, desto mehr Schatten kriechen aus dem Unterholz.',
      play: 'Nacht beginnen', workshop: 'Werkstatt', back: 'Zurück',
      best: 'Längste Nacht', noBest: 'noch keine', wins: '{n}× Morgengrauen erlebt',
      hint: 'Bewegen mit WASD, Pfeiltasten, Gamepad oder Finger ziehen. Deine Laterne kämpft von allein.',
      music: 'Musik', sound: 'Geräusche', on: 'an', off: 'aus', langBtn: 'English',
      lvShort: 'Stufe {n}', lvTitle: 'Stufe {n}', lvSub: 'Wähle eine Gabe für die Nacht', reroll: 'Neu würfeln ({n})', isNew: 'neu', lvLine: 'Stufe {a} → {b}',
      paused: 'Pause', resume: 'Weiter', giveUp: 'Nacht aufgeben',
      winTitle: 'Morgengrauen', winSub: 'Du hast die ganze Nacht durchgehalten. Die Schatten ziehen sich ins Unterholz zurück.',
      loseTitle: 'Die Laterne erlischt', loseSub: 'Diesmal war die Nacht stärker. Deinen Bernstein behältst du.',
      survived: 'Durchgehalten bis', defeated: 'Schatten vertrieben', reached: 'Stufe',
      record: 'Neue längste Nacht', again: 'Noch eine Nacht', menu: 'Menü',
      bossWarn: 'Der Schattenhirsch erwacht', bossName: 'Schattenhirsch', waveWarn: 'Ein Mottenschwarm naht', dawnSoon: 'Der Himmel wird heller',
      revive: 'Zweite Flamme', maxed: 'Voll', buy: 'Kaufen', amber: 'Bernstein',
      wsSub: 'Bernstein bleibt nach jeder Nacht erhalten. Hier verbesserst du deine Ausrüstung dauerhaft.',
      bdDrops: 'gesammelt', bdTime: 'für die Zeit', bdWin: 'Sieg',
      berriesName: 'Waldbeeren', berriesDesc: 'Heilt 30 Leben und gibt 5 Bernstein.',
    },
    en: {
      eyebrow: 'One night in the woods · 10 pm to 6 am',
      tagline: 'Keep your lantern burning until dawn. The darker the night, the more shadows crawl out of the undergrowth.',

      const c = gcy(e.y) * G.n + gcx(e.x);
      G.next[i] = G.head[c]; G.head[c] = i;
    }
  }
  const QB = [];
  function query(x, y, r) {
    QB.length = 0;
    const x0 = gcx(x - r), x1 = gcx(x + r), y0 = gcy(y - r), y1 = gcy(y + r);
    for (let gy = y0; gy <= y1; gy++) for (let gx = x0; gx <= x1; gx++) {
      for (let j = G.head[gy * G.n + gx]; j !== -1; j = G.next[j]) { const e = enemies[j]; if (!e.dead) QB.push(e); }
    }
    return QB;
  }
  function separate() {
    const n = G.n;
    for (let i = 0; i < enemies.length; i++) {
      const a = enemies[i];
      if (a.dead) continue;
      const cx = gcx(a.x), cy = gcy(a.y);
      for (let y = Math.max(0, cy - 1); y <= Math.min(n - 1, cy + 1); y++) for (let x = Math.max(0, cx - 1); x <= Math.min(n - 1, cx + 1); x++) {
        for (let j = G.head[y * n + x]; j !== -1; j = G.next[j]) {
          if (j <= i) continue;
          const b = enemies[j];
          if (b.dead) continue;
          const dx = b.x - a.x, dy = b.y - a.y, rr = (a.r + b.r) * 0.9, d2 = dx * dx + dy * dy;
          if (d2 >= rr * rr || d2 < 1e-4) continue;
          const d = Math.sqrt(d2), o = ((rr - d) / d) * 0.5, ma = a.d.mass, mb = b.d.mass, t = ma + mb;
          a.x -= dx * o * (mb / t); a.y -= dy * o * (mb / t);
          b.x += dx * o * (ma / t); b.y += dy * o * (ma / t);
        }
      }
    }
  }

  // ---------- Eingabe ----------
  const keys = {};
  const joy = { active: false, id: -1, ox: 0, oy: 0, dx: 0, dy: 0 };
  function padInput() {
    try {
      const pads = navigator.getGamepads ? navigator.getGamepads() : [];
      for (const p of pads) {
        if (!p) continue;
        const b = p.buttons;
        let x = p.axes[0] || 0, y = p.axes[1] || 0;
        if (b[14] && b[14].pressed) x = -1; if (b[15] && b[15].pressed) x = 1;
        if (b[12] && b[12].pressed) y = -1; if (b[13] && b[13].pressed) y = 1;
        if (Math.hypot(x, y) > 0.2) return [x, y];
      }
    } catch (e) { /* Gamepad nicht erlaubt */ }
    return null;
  }

  // ---------- Lauf ----------
  function startRun() {
    enemies = []; shots = []; spores = []; gems = []; loot = []; parts = []; texts = []; pulses = []; stars = []; flashes = [];
    run = {
      t: 0, kills: 0, amber: 0, xp: 0, lv: 1, need: xpNeed(1), pending: 0,
      items: { spark: 1 }, ws: { spark: 0.4, ffA: 0, pulse: 1.2, stars: 1 },
      acc: 0, nextWave: 50, boss: null, bossN: 0, rerolls: 1 + (save.up.luck || 0), revives: save.up.flame || 0,
      won: false, dawnT: 0, deathT: 0, dawnSaid: false, choices: [], lvLock: 0,
    };
    Object.assign(P, { x: 0, y: 0, face: 1, walk: 0, moving: false, inv: 1, dead: false });
    recalc(); P.hp = P.maxHp;
    cam.x = 0; cam.y = 0;
    clearTimeout(bannerTimer); E('banner').classList.remove('show');
    state = 'play'; showScreen(null); updateInv();
    Platform.gameplayStart();
    Snd.init(); Music.start();
  }

  function edgePoint(a = Math.random() * TAU) {
    const hw = W / 2 / zoom + 70, hh = H / 2 / zoom + 70, c = Math.cos(a), s = Math.sin(a);
    const k = Math.min(hw / Math.max(Math.abs(c), 1e-3), hh / Math.max(Math.abs(s), 1e-3));
    return [P.x + c * k, P.y + s * k];
  }
  function pickType(t) {
    const r = Math.random();
    if (t < 45) return r < 0.8 ? 'shade' : 'moth';
    if (t < 120) return r < 0.55 ? 'shade' : r < 0.85 ? 'moth' : 'crow';
    if (t < 150) return r < 0.5 ? 'shade' : r < 0.78 ? 'moth' : 'crow';
    if (t < 220) return r < 0.45 ? 'shade' : r < 0.7 ? 'moth' : r < 0.87 ? 'crow' : 'rootling';
    return r < 0.38 ? 'shade' : r < 0.6 ? 'moth' : r < 0.74 ? 'crow' : r < 0.88 ? 'rootling' : 'spitter';
  }
  function spawnEnemy(type, x, y) {
    const d = EN[type], hp = d.hp * (1 + run.t / 170 + (run.t / 320) ** 2);
    const e = { type, d, x, y, kx: 0, ky: 0, hp, max: hp, r: d.r, face: 1, fl: 0, oc: 0, anim: Math.random() * 10, ph: Math.random() * TAU, st: 0, tm: rand(1, 3), t2: 6, ax: 0, ay: 0, dead: false };
    enemies.push(e);
    return e;
  }
  function spawnTick(dt) {
    const t = run.t;
    run.acc += dt * (0.8 + t * 0.03 + (t / 140) ** 2 + Math.max(0, t - 300) ** 2 / 2500);
    while (run.acc >= 1) {
      run.acc -= 1;
      if (enemies.length < MAXE) { const [x, y] = edgePoint(); spawnEnemy(pickType(t), x, y); }
    }
    if (t >= run.nextWave) {
      run.nextWave += 60;
      const n = Math.round(14 + t / 15), a0 = Math.random() * TAU;
      for (let i = 0; i < n && enemies.length < MAXE + 40; i++) { const [x, y] = edgePoint(a0 + (i / n) * TAU); spawnEnemy('moth', x, y); }
      banner(T('waveWarn'), 1.6);
    }
    if ((run.bossN === 0 && t >= 180) || (run.bossN === 1 && t >= 360)) {
      run.bossN++;
      const [x, y] = edgePoint(), e = spawnEnemy('stag', x, y);
      e.hp = e.max = run.bossN === 1 ? 1500 : 4200;
      run.boss = e;
      banner(T('bossWarn')); Snd.play('boss'); shake(4);
    }
    if (!run.dawnSaid && t >= 400) { run.dawnSaid = true; banner(T('dawnSoon')); }
  }

  function updatePlayer(dt) {
    let ix = 0, iy = 0;
    if (keys.a || keys.arrowleft) ix -= 1;
    if (keys.d || keys.arrowright) ix += 1;
    if (keys.w || keys.arrowup) iy -= 1;
    if (keys.s || keys.arrowdown) iy += 1;
    const pad = padInput();
    if (pad) { ix = pad[0]; iy = pad[1]; }
    if (joy.active) { ix = joy.dx; iy = joy.dy; }
    if (dbg.input) { ix = dbg.input.x; iy = dbg.input.y; }
    const m = Math.hypot(ix, iy);
    if (m > 1) { ix /= m; iy /= m; }
    P.x += ix * P.speed * dt; P.y += iy * P.speed * dt;
    P.moving = m > 0.1;
    if (Math.abs(ix) > 0.1) P.face = ix > 0 ? 1 : -1;
    if (P.moving) P.walk += dt;
    P.inv -= dt;
    P.hp = Math.min(P.maxHp, P.hp + P.regen * dt);
  }

  function hurtPlayer(d, src) {
    if (P.inv > 0 || P.dead || run.won) return;
    P.hp -= d; P.inv = 0.6; shake(5); Snd.play('hurt');
    if (dbg.hurt) dbg.hurt[src] = (dbg.hurt[src] || 0) + Math.round(d);
    if (P.hp > 0) return;
    if (run.revives > 0) {
      run.revives--; P.hp = Math.round(P.maxHp * 0.6); P.inv = 2.5;
      banner(T('revive')); Snd.play('level');
      pulses.push({ x: P.x, y: P.y, R: 320, life: 0.6, max: 0.6 });
      for (const e of enemies) {
        if (e.dead) continue;
        const dx = e.x - P.x, dy = e.y - P.y, dd = Math.hypot(dx, dy) || 1;
        if (dd < 320) hit(e, 250, dx / dd, dy / dd, 500);
      }
    } else {
      P.hp = 0; P.dead = true; run.deathT = 0; Snd.play('lose');
    }
  }

  function updateEnemies(dt) {
    const t = run.t, far = Math.max(W, H) / 2 / zoom + 420;
    for (const e of enemies) {
      if (e.dead) continue;
      const dx = P.x - e.x, dy = P.y - e.y, dist = Math.hypot(dx, dy) || 1;
      let mx = dx / dist, my = dy / dist, sp = e.d.sp * (dist < P.light * 0.9 ? 0.8 : 1);
      switch (e.type) {
        case 'moth': {
          const a = Math.sin(t * 5 + e.ph) * 0.9, c = Math.cos(a), s = Math.sin(a);
          const nx = mx * c - my * s; my = mx * s + my * c; mx = nx;
          break;
        }
        case 'crow':
          if (e.st === 0) { e.tm -= dt; if (dist < 300 && e.tm <= 0) { e.st = 1; e.tm = 0.45; e.ax = mx; e.ay = my; } }
          else if (e.st === 1) { sp = 0; e.tm -= dt; if (e.tm <= 0) { e.st = 2; e.tm = 0.5; Snd.play('dash'); } }
          else { sp = 360; mx = e.ax; my = e.ay; e.tm -= dt; if (e.tm <= 0) { e.st = 0; e.tm = rand(1.8, 3); } }
          break;
        case 'spitter':
          if (dist < 210) { mx = -mx; my = -my; sp *= 0.6; } else if (dist < 270) sp = 0;
          e.tm -= dt;
          if (e.tm <= 0 && dist < 420) {
            e.tm = rand(2.2, 3);
            spores.push({ x: e.x, y: e.y - 4, vx: (dx / dist) * 160, vy: (dy / dist) * 160, r: 6, dmg: 9 * (1 + t / 400), life: 5 });
            Snd.play('spore');
          }
          break;
        case 'stag':
          e.tm -= dt;
          if (e.st === 0) { if (e.tm <= 0) { e.st = 1; e.tm = 0.8; e.ax = mx; e.ay = my; } }
          else if (e.st === 1) { sp = 0; if (e.tm <= 0) { e.st = 2; e.tm = 0.75; shake(5); Snd.play('dash'); } }
          else { sp = 520; mx = e.ax; my = e.ay; if (e.tm <= 0) { e.st = 0; e.tm = rand(3.5, 5); } }
          e.t2 -= dt;
          if (e.t2 <= 0 && e.st === 0) {
            e.t2 = 6.5;
            for (let i = 0; i < 14; i++) { const a = (i / 14) * TAU; spores.push({ x: e.x, y: e.y, vx: Math.cos(a) * 140, vy: Math.sin(a) * 140, r: 7, dmg: 9, life: 5 }); }
            Snd.play('spore');
          }
          break;
      }
      e.x += (mx * sp + e.kx) * dt; e.y += (my * sp + e.ky) * dt;
      const kd = Math.exp(-9 * dt); e.kx *= kd; e.ky *= kd;
      if (Math.abs(mx * sp) > 4) e.face = mx > 0 ? 1 : -1;
      e.anim += dt * e.d.anim; e.fl -= dt; e.oc -= dt;
      if (!P.dead && dist < e.r + P.r - 2) hurtPlayer(e.d.boss ? e.d.dmg : e.d.dmg * (1 + t / 600), e.type);
      if (dist > far && !e.d.boss) { const p = edgePoint(); e.x = p[0]; e.y = p[1]; e.kx = e.ky = 0; }
    }
  }

  // ---------- Treffer, Beute, Erfahrung ----------
  function hit(e, dmg, nx, ny, kb) {
    if (e.dead) return;
    e.hp -= dmg; e.fl = e.d.boss ? 0.06 : 0.1;
    if (kb && !e.d.boss) { const k = kb / e.d.mass; e.kx += nx * k; e.ky += ny * k; }
    if (texts.length < 28) texts.push({ x: e.x + rand(-6, 6), y: e.y - e.r - 4, v: Math.round(dmg), life: 0.55 });
    Snd.play('hit');
    if (e.hp <= 0) kill(e);
  }
  function addLoot(t, x, y) { loot.push({ t, x, y, m: false, sp: 0 }); }
  function kill(e) {
    e.dead = true; run.kills++;
    const d = e.d;
    if (gems.length >= 450) gems[(Math.random() * gems.length) | 0].v += d.xp;
    else gems.push({ x: e.x + rand(-4, 4), y: e.y + rand(-4, 4), v: d.xp, m: false, sp: 0 });
    if (d.boss) {
      for (let i = 0; i < 12; i++) addLoot('amber', e.x + rand(-45, 45), e.y + rand(-35, 35));
      addLoot('berry', e.x, e.y + 20);
      run.boss = null; shake(9);
      flashes.push({ x: e.x, y: e.y, r: 320, life: 0.5, max: 0.5 });
      Snd.play('win');
    } else {
      const r = Math.random();
      if (r < 0.028) addLoot('amber', e.x, e.y);
      else if (r < 0.038) addLoot('berry', e.x, e.y);
      else if (r < 0.0398) addLoot('moon', e.x, e.y);
    }
    smoke(e.x, e.y, d.boss ? 30 : 6, d.smoke);
    for (const [ex, ey] of d.eyes) parts.push({ x: e.x + ex * e.face, y: e.y + ey, vx: rand(-60, 60), vy: rand(-90, -30), life: 0.5, max: 0.5, r: 3, g: d.eye });
    Snd.play('pop');
  }
  function smoke(x, y, n, col) {
    for (let i = 0; i < n && parts.length < 800; i++) {
      const a = Math.random() * TAU, s = rand(20, 70), l = rand(0.4, 0.8);
      parts.push({ x: x + rand(-6, 6), y: y + rand(-8, 4), vx: Math.cos(a) * s, vy: Math.sin(a) * s - 20, life: l, max: l, r: rand(5, 10), smoke: col });
    }
  }
  function burst(x, y, n, g, sp = 160) {
    for (let i = 0; i < n && parts.length < 800; i++) {
      const a = Math.random() * TAU, s = rand(0.3, 1) * sp, l = rand(0.25, 0.55);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: l, max: l, r: rand(2, 4), g });
    }
  }
  function gainXp(v) {
    run.xp += v * P.xpMul;
    while (run.xp >= run.need) { run.xp -= run.need; run.lv++; run.need = xpNeed(run.lv); run.pending++; }
  }

  // ---------- Waffen ----------
  const NB = [];
  function nearest(n, range) {
    NB.length = 0;
    const r2 = range * range;
    for (const e of enemies) {
      if (e.dead) continue;
      const dx = e.x - P.x, dy = e.y - P.y, d = dx * dx + dy * dy;
      if (d > r2) continue;
      if (NB.length < n) NB.push([d, e]);
      else if (d < NB[n - 1][0]) NB[n - 1] = [d, e];
      else continue;
      NB.sort((a, b) => a[0] - b[0]);
    }
    return NB.map(x => x[1]);
  }
  function updateWeapons(dt) {
    const it = run.items, ws = run.ws, m = P.dmgMul;
    if (it.spark) {
      const s = ITEMS.spark.s, l = it.spark - 1;
      if ((ws.spark -= dt) <= 0) {
        const n = s.n[l], tg = nearest(n, 540);
        if (tg.length) {
          ws.spark = s.cd[l] * P.cdMul;
          for (let i = 0; i < n; i++) {
            const e = tg[i % tg.length];
            let a = Math.atan2(e.y - (P.y - 4), e.x - P.x);
            if (i >= tg.length) a += (i % 2 ? 1 : -1) * 0.2 * Math.ceil((i - tg.length + 1) / 2);
            shots.push({ x: P.x + Math.cos(a) * 12, y: P.y - 4 + Math.sin(a) * 12, vx: Math.cos(a) * 560, vy: Math.sin(a) * 560, r: 6, dmg: s.dmg[l] * m, pierce: s.pierce[l], life: 1.1, hit: [] });
          }
          Snd.play('shoot');
        } else ws.spark = 0.1;
      }
    }
    ff.length = 0;
    if (it.fireflies) {
      const s = ITEMS.fireflies.s, l = it.fireflies - 1, n = s.n[l], R = s.rad[l];
      ws.ffA += dt * s.sp[l];
      for (let i = 0; i < n; i++) {
        const a = ws.ffA + (i * TAU) / n, x = P.x + Math.cos(a) * R, y = P.y - 4 + Math.sin(a) * R;
        ff.push(x, y);
        const q = query(x, y, 60);
        for (let j = 0; j < q.length; j++) {
          const e = q[j];
          if (e.oc > 0) continue;
          const dx = e.x - x, dy = e.y - y;
          if (dx * dx + dy * dy < (e.r + 8) ** 2) {
            e.oc = 0.4;
            const d = Math.hypot(e.x - P.x, e.y - P.y) || 1;
            hit(e, s.dmg[l] * m, (e.x - P.x) / d, (e.y - P.y) / d, 120);
          }
        }
      }
    }
    if (it.pulse) {
      const s = ITEMS.pulse.s, l = it.pulse - 1;
      if ((ws.pulse -= dt) <= 0) {
        ws.pulse = s.cd[l] * P.cdMul;
        const R = s.rad[l];
        pulses.push({ x: P.x, y: P.y, R, life: 0.45, max: 0.45 });
        const q = query(P.x, P.y, R + 50);
        for (let j = 0; j < q.length; j++) {
          const e = q[j], dx = e.x - P.x, dy = e.y - P.y, d = Math.hypot(dx, dy) || 1;
          if (d < R + e.r) hit(e, s.dmg[l] * m, dx / d, dy / d, 280);
        }
        for (const sp of spores) if ((sp.x - P.x) ** 2 + (sp.y - P.y) ** 2 < R * R) sp.dead = true;
        Snd.play('pulse');
      }
    }
    if (it.stars) {
      const s = ITEMS.stars.s, l = it.stars - 1;
      if ((ws.stars -= dt) <= 0) {
        const c = [];
        for (const e of enemies) if (!e.dead && (e.x - P.x) ** 2 + (e.y - P.y) ** 2 < 440 * 440) c.push(e);
        if (c.length) {
          ws.stars = s.cd[l] * P.cdMul;
          for (let i = 0; i < s.n[l] && c.length; i++) {
            const e = c.splice((Math.random() * c.length) | 0, 1)[0];
            stars.push({ e, x: e.x, y: e.y, t: 0.5, R: s.rad[l], dmg: s.dmg[l] * m });
          }
        } else ws.stars = 0.25;
      }
    }
  }
  function impact(s) {
    const q = query(s.x, s.y, s.R + 50);
    for (let i = 0; i < q.length; i++) {
      const e = q[i], dx = e.x - s.x, dy = e.y - s.y, d = Math.hypot(dx, dy) || 1;
      if (d < s.R + e.r) hit(e, s.dmg, dx / d, dy / d, 160);
    }
    flashes.push({ x: s.x, y: s.y, r: s.R * 2.4, life: 0.3, max: 0.3 });
    burst(s.x, s.y, 10, 'gold', 260); shake(2.5); Snd.play('star');
  }

  function updateShots(dt) {
    for (const b of shots) {
      if (b.dead) continue;
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      if (b.life <= 0) { b.dead = true; continue; }
      const q = query(b.x, b.y, b.r + 50);
      for (let i = 0; i < q.length; i++) {
        const e = q[i];
        if (e.dead || b.hit.includes(e)) continue;
        const dx = e.x - b.x, dy = e.y - b.y, rr = e.r + b.r;
        if (dx * dx + dy * dy < rr * rr) {
          b.hit.push(e);
          hit(e, b.dmg, b.vx / 560, b.vy / 560, 90);
          burst(b.x, b.y, 3, 'warm', 90);
          if (b.pierce-- <= 0) { b.dead = true; break; }
        }
      }
    }
    for (const s of spores) {
      if (s.dead) continue;
      s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
      if (s.life <= 0) { s.dead = true; continue; }
      const dx = s.x - P.x, dy = s.y - P.y;
      if (!P.dead && dx * dx + dy * dy < (s.r + P.r) ** 2) { s.dead = true; hurtPlayer(s.dmg, 'spore'); }
    }
  }

  function updatePickups(dt) {
    const px = P.x, py = P.y - 2;
    for (const g of gems) {
      if (g.dead) continue;
      const dx = px - g.x, dy = py - g.y, d = Math.hypot(dx, dy);
      if (!g.m && d < P.magnet) g.m = true;
      if (!g.m) continue;
      g.sp = Math.min(g.sp + 1600 * dt, 1000);
      if (d < P.r + 6 || g.sp * dt >= d) { g.dead = true; gainXp(g.v); Snd.play('gem'); continue; }
      g.x += (dx / d) * g.sp * dt; g.y += (dy / d) * g.sp * dt;
    }
    for (const o of loot) {
      if (o.dead) continue;
      const dx = px - o.x, dy = py - o.y, d = Math.hypot(dx, dy);
      if (!o.m && d < P.magnet) o.m = true;
      if (!o.m) continue;
      o.sp = Math.min(o.sp + 1400 * dt, 900);
      if (d < P.r + 6 || o.sp * dt >= d) {
        o.dead = true;
        if (o.t === 'amber') { run.amber++; Snd.play('amber'); }
        else if (o.t === 'berry') { P.hp = Math.min(P.maxHp, P.hp + 30); Snd.play('heal'); burst(P.x, P.y, 8, 'berry', 120); }
        else { for (const g of gems) g.m = true; Snd.play('moon'); flashes.push({ x: P.x, y: P.y, r: 260, life: 0.4, max: 0.4 }); }
        continue;
      }
      o.x += (dx / d) * o.sp * dt; o.y += (dy / d) * o.sp * dt;
    }
  }

  function updateFx(dt) {
    for (const p of parts) {
      p.life -= dt;
      if (p.life <= 0) { p.dead = true; continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      const f = Math.exp(-dt * (p.smoke ? 2 : 4)); p.vx *= f; p.vy *= f;
    }
    for (const t of texts) { t.life -= dt; t.y -= 34 * dt; if (t.life <= 0) t.dead = true; }
    for (const p of pulses) { p.life -= dt; if (p.life <= 0) p.dead = true; }
    for (const f of flashes) { f.life -= dt; if (f.life <= 0) f.dead = true; }
    for (const s of stars) {
      if (s.dead) continue;
      s.t -= dt;
      if (s.e && !s.e.dead && s.t > 0.15) { s.x = s.e.x; s.y = s.e.y; }
      if (s.t <= 0) { s.dead = true; impact(s); }
    }
  }

  function compact(a) {
    let j = 0;
    for (let i = 0; i < a.length; i++) { const e = a[i]; if (!e.dead) a[j++] = e; }
    a.length = j;
  }

  function startDawn() {
    run.won = true; run.dawnT = 0; P.inv = 99;
    for (const e of enemies) if (!e.dead) { e.dead = true; smoke(e.x, e.y, 4, e.d.smoke); }
    for (const s of spores) s.dead = true;
    for (const g of gems) g.m = true;
    run.boss = null;
    banner(T('winTitle'), 2.6); Snd.play('win');
  }

  function step(dt) {
    if (P.dead) {
      run.deathT += dt;
      if (run.deathT > 1.6) { endRun(false); return; }
      dt *= 0.3;
    }
    if (run.won) {
      run.dawnT += dt;
      if (run.dawnT > 3) { endRun(true); return; }
    } else if (!P.dead) {
      run.t += dt;
      if (run.t >= RUN_LEN) startDawn();
    }
    if (!P.dead) updatePlayer(dt);
    if (!run.won && !P.dead) spawnTick(dt);
    updateEnemies(dt);
    buildGrid(); separate();
    if (!P.dead && !run.won) updateWeapons(dt);
    updateShots(dt); updatePickups(dt); updateFx(dt);
    for (const a of [enemies, shots, spores, gems, loot, parts, texts, pulses, stars, flashes]) compact(a);
    const k = 1 - Math.exp(-dt * 7);
    cam.x += (P.x - cam.x) * k; cam.y += (P.y - cam.y) * k;
    if (run.pending > 0 && !P.dead && !run.won) openLevelUp();
    updateHud();
  }

  function menuStep(dt) {
    menuT += dt;
    P.x = 0; P.y = 0; P.face = 1; P.moving = false; P.inv = 0;
    const wide = W > 760;
    cam.x = P.x - (wide ? (W / 2 / zoom) * 0.32 : 0);
    cam.y = P.y + (wide ? -10 : (H / 2 / zoom) * 0.5);
  }

  // ---------- Zeichnen ----------
  const LN = 600, Lx = new Float32Array(LN), Ly = new Float32Array(LN), Lr = new Float32Array(LN), La = new Float32Array(LN);
  let Lc = 0;
  function light(x, y, r, a) { if (Lc < LN) { Lx[Lc] = x; Ly[Lc] = y; Lr[Lc] = r; La[Lc] = a; Lc++; } }
  function glow(k, x, y, r, a) { ctx.globalAlpha = a; ctx.drawImage(GL[k], x - r, y - r, r * 2, r * 2); }

  function drawDecor(L, T0, R, B) {
    mushPts.length = 0;
    const x0 = Math.floor(L / DC) - 1, x1 = Math.floor(R / DC), y0 = Math.floor(T0 / DC) - 1, y1 = Math.floor(B / DC);
    for (let cy = y0; cy <= y1; cy++) for (let cx = x0; cx <= x1; cx++) {
      const h = hash3(cx, cy, 1);
      let s;
      const v = hash3(cx, cy, 4);
      if (h < 0.16) s = DECOR.mush[(v * 3) | 0];
      else if (h < 0.38) s = DECOR.fern[(v * 2) | 0];
      else if (h < 0.48) s = DECOR.rock[(v * 2) | 0];
      else if (h < 0.52) s = DECOR.log[0];
      else continue;
      const x = (cx + 0.15 + hash3(cx, cy, 2) * 0.7) * DC, y = (cy + 0.15 + hash3(cx, cy, 3) * 0.7) * DC;
      ctx.drawImage(s.c, x - s.h, y - s.h, s.s, s.s);
      if (h < 0.16) { mushPts.push(x, y - 6); light(x, y - 6, 90, 0.45); }
    }
  }

  function drawPlayer(time) {
    const bob = P.moving ? Math.abs(Math.sin(P.walk * 9)) * -2 : Math.sin(time * 2) * 0.5;
    const sw = P.moving ? Math.sin(P.walk * 9) * 1.4 : 0;
    ctx.globalAlpha = 1;
    ctx.drawImage(shadowSpr, P.x - 13, P.y + 8, 26, 9);
    if (P.inv > 0 && run && !run.won && Math.sin(time * 40) > 0) ctx.globalAlpha = 0.45;
    ctx.save(); ctx.translate(P.x, P.y + bob); ctx.scale(P.face, 1);
    ctx.fillStyle = '#2b4a3a'; ctx.beginPath();
    ctx.moveTo(-9, 12); ctx.lineTo(-7, -3); ctx.quadraticCurveTo(0, -9, 7, -3); ctx.lineTo(9, 12); ctx.quadraticCurveTo(0, 15, -9, 12); ctx.fill();
    ctx.strokeStyle = '#3f6b52'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(-8.5, 11.5); ctx.quadraticCurveTo(0, 14.5, 8.5, 11.5); ctx.stroke();
    ctx.fillStyle = '#35604a'; ctx.beginPath(); ctx.arc(0, -8, 7.5, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-6, -11); ctx.quadraticCurveTo(-11, -13, -12, -7); ctx.quadraticCurveTo(-8, -8, -6, -5); ctx.fill();
    ctx.fillStyle = '#0c1311'; ctx.beginPath(); ctx.ellipse(2.6, -7.2, 4.4, 4, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffd9a0'; ctx.fillRect(1.2, -8, 1.3, 1.3); ctx.fillRect(4.2, -8, 1.3, 1.3);
    ctx.strokeStyle = '#223b2e'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(4, -1); ctx.lineTo(10, 1 + sw * 0.5); ctx.stroke();
    ctx.strokeStyle = '#6b5636'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(11, sw * 0.5); ctx.lineTo(11, 2.5 + sw); ctx.stroke();
    ctx.fillStyle = '#3b2f1e'; ctx.fillRect(8.2, 2.5 + sw, 5.6, 7.5);
    ctx.fillStyle = '#ffd27a'; ctx.fillRect(9.2, 3.8 + sw, 3.6, 5);
    ctx.restore();
    ctx.globalAlpha = 1;
    P.lx = P.x + 11 * P.face; P.ly = P.y + bob + 6.3 + sw;
  }

  const menuMoths = [];
  function render(time) {
    const hw = W / 2 / zoom, hh = H / 2 / zoom;
    let ox = 0, oy = 0;
    if (shakeAmt > 0.1 && !REDUCED) { ox = (Math.random() * 2 - 1) * shakeAmt; oy = (Math.random() * 2 - 1) * shakeAmt; }
    const cx = cam.x + ox, cy = cam.y + oy, k = DPR * zoom, tx = (DPR * W) / 2 - cx * k, ty = (DPR * H) / 2 - cy * k;
    const L = cx - hw - 80, R = cx + hw + 80, T0 = cy - hh - 80, B = cy + hh + 80;
    const inView = (x, y) => x > L && x < R && y > T0 && y < B;
    Lc = 0;

    // Boden und Deko
    ctx.setTransform(k, 0, 0, k, tx, ty);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    ctx.fillStyle = groundPat; ctx.fillRect(L, T0, R - L, B - T0);
    drawDecor(L, T0, R, B);

    // Funken und Beute
    for (const g of gems) if (inView(g.x, g.y)) { const s = gemSpr[gemTier(g.v)]; ctx.drawImage(s.c, g.x - 7, g.y - 7, 14, 14); }
    for (const o of loot) if (inView(o.x, o.y)) { const s = lootSpr[o.t], b = Math.sin(time * 4 + o.x) * 1.5; ctx.drawImage(s.c, o.x - s.h, o.y - s.h + b, s.s, s.s); }

    // Rauch
    for (const p of parts) {
      if (!p.smoke || !inView(p.x, p.y)) continue;
      const f = p.life / p.max, r = p.r * (1.6 - f * 0.6);
      ctx.globalAlpha = f * 0.9; ctx.drawImage(smokeSpr(p.smoke), p.x - r, p.y - r, r * 2, r * 2);
    }
    ctx.globalAlpha = 1;

    // Gegner nach Höhe sortiert, Spieler dazwischen
    enemies.sort((a, b) => a.y - b.y);
    for (const e of enemies) if (inView(e.x, e.y)) ctx.drawImage(shadowSpr, e.x - e.r, e.y + e.r * 0.75 - e.r * 0.3, e.r * 2, e.r * 0.6);
    let pDrawn = false;
    for (const e of enemies) {
      if (!pDrawn && e.y > P.y) { drawPlayer(time); pDrawn = true; }
      if (!inView(e.x, e.y)) continue;
      const s = e.d.spr[(e.anim | 0) & 1];
      const bob = e.type === 'shade' ? Math.sin(e.anim) * 2 : 0;
      ctx.setTransform(k * e.face, 0, 0, k, tx + e.x * k, ty + (e.y + bob) * k);
      ctx.drawImage(s.c, -s.h, -s.h, s.s, s.s);
      if (e.fl > 0) { ctx.globalAlpha = e.d.boss ? 0.35 : 0.7; ctx.drawImage(s.w, -s.h, -s.h, s.s, s.s); ctx.globalAlpha = 1; }
      ctx.setTransform(k, 0, 0, k, tx, ty);
    }
    if (!pDrawn) drawPlayer(time);

    // Motten im Menü umkreisen die Laterne
    menuMoths.length = 0;
    if (!run) {
      for (let i = 0; i < 3; i++) {
        const a = menuT * (1.3 + i * 0.4) + i * 2.1;
        const x = P.lx + Math.cos(a) * (26 + i * 10), y = P.ly - 8 + Math.sin(a * 1.7) * (16 + i * 6);
        menuMoths.push(x, y);
        const s = EN.moth.spr[((menuT * 16 + i * 3) | 0) & 1], f = Math.cos(a) > 0 ? -1 : 1;
        ctx.setTransform(k * f * 0.8, 0, 0, k * 0.8, tx + x * k, ty + y * k);
        ctx.drawImage(s.c, -s.h, -s.h, s.s, s.s);
      }
      ctx.setTransform(k, 0, 0, k, tx, ty);
    }
    for (const s of spores) if (inView(s.x, s.y)) { ctx.fillStyle = '#2a1238'; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill(); }

    // Lichtquellen sammeln
    let fade = 1;
    if (run && P.dead) fade = Math.max(0, 1 - run.deathT / 1.4);
    const fl = 1 + Math.sin(time * 9.7) * 0.02 + Math.sin(time * 23.1) * 0.015;
    light(P.lx, P.ly, P.light * fl * fade, 1);
    light(P.lx, P.ly, P.light * 1.9 * fade, 0.38);
    for (const b of shots) if (inView(b.x, b.y)) light(b.x, b.y, 44, 0.55);
    for (let i = 0; i < ff.length; i += 2) light(ff[i], ff[i + 1], 52, 0.5);
    for (const s of spores) if (inView(s.x, s.y)) light(s.x, s.y, 38, 0.4);
    for (const o of loot) if (inView(o.x, o.y)) light(o.x, o.y, 36, 0.5);
    for (const p of pulses) { const q = 1 - p.life / p.max; light(p.x, p.y, p.R * (0.3 + 0.8 * q), (1 - q) * 0.8); }
    for (const f of flashes) light(f.x, f.y, f.r, f.life / f.max);
    for (const s of stars) { const q = s.t / 0.5; light(s.x + 220 * q, s.y - 620 * q, 90, 0.7); light(s.x, s.y, s.R * 1.3, 0.25); }
    for (const g of gems) if (Lc < 420 && inView(g.x, g.y)) light(g.x, g.y, 20, 0.45);

    // Dunkelheit
    let dark = 0.87;
    if (run) {
      if (run.t > 400) dark -= Math.min(1, (run.t - 400) / 80) * 0.3;
      if (run.won) dark *= Math.max(0, 1 - run.dawnT / 2);
    }
    dctx.setTransform(1, 0, 0, 1, 0, 0);
    dctx.globalCompositeOperation = 'source-over'; dctx.globalAlpha = 1;
    dctx.clearRect(0, 0, dk.width, dk.height);
    dctx.fillStyle = `rgba(3,5,15,${dark})`; dctx.fillRect(0, 0, dk.width, dk.height);
    dctx.globalCompositeOperation = 'destination-out';
    const q = zoom / 4;
    dctx.setTransform(q, 0, 0, q, W / 8 - cx * q, H / 8 - cy * q);
    for (let i = 0; i < Lc; i++) { dctx.globalAlpha = La[i]; dctx.drawImage(lightSpr, Lx[i] - Lr[i], Ly[i] - Lr[i], Lr[i] * 2, Lr[i] * 2); }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    ctx.drawImage(dk, 0, 0, cv.width, cv.height);

    // Leuchten (additiv)
    ctx.setTransform(k, 0, 0, k, tx, ty);
    ctx.globalCompositeOperation = 'lighter';
    glow('amber', P.lx, P.ly, 64 * fl * fade, 0.5);
    glow('warm', P.lx, P.ly, 14 * fade, 0.9);
    glow('warm', P.x, P.y, P.light * 0.9 * fade, 0.08);
    for (let i = 0; i < mushPts.length; i += 2) glow('teal', mushPts[i], mushPts[i + 1], 30, 0.32 + 0.1 * Math.sin(time * 2 + mushPts[i]));
    for (const g of gems) if (inView(g.x, g.y)) glow(GEM_GLOW[gemTier(g.v)], g.x, g.y, 12, 0.6);
    for (const o of loot) if (inView(o.x, o.y)) glow(o.t === 'amber' ? 'amber' : o.t === 'berry' ? 'berry' : 'moon', o.x, o.y, o.t === 'moon' ? 26 : 16, 0.6);
    for (const b of shots) {
      if (!inView(b.x, b.y)) continue;
      glow('amber', b.x - b.vx * 0.02, b.y - b.vy * 0.02, 11, 0.5);
      glow('warm', b.x, b.y, 15, 0.9); glow('white', b.x, b.y, 5, 0.9);
    }
    for (let i = 0; i < ff.length; i += 2) { glow('fire', ff[i], ff[i + 1], 18, 0.8); glow('white', ff[i], ff[i + 1], 4, 0.9); }
    for (const s of spores) if (inView(s.x, s.y)) { glow('lilac', s.x, s.y, 16, 0.8); glow('white', s.x, s.y, 3, 0.5); }
    for (const e of enemies) {
      if (!inView(e.x, e.y)) continue;
      const bob = e.type === 'shade' ? Math.sin(e.anim) * 2 : 0;
      const r = e.type === 'crow' && e.st === 1 ? 10 : e.d.boss ? 8 : 5;
      for (const [ex, ey] of e.d.eyes) glow(e.d.eye, e.x + ex * e.face, e.y + ey + bob, r, 0.95);
      if (e.type === 'stag' && e.st === 1) {
        ctx.globalAlpha = 1;
        ctx.strokeStyle = 'rgba(170,220,255,.12)'; ctx.lineWidth = e.r * 1.6; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.x + e.ax * 390, e.y + e.ay * 390); ctx.stroke();
        ctx.strokeStyle = 'rgba(170,220,255,.35)'; ctx.lineWidth = 2; ctx.setLineDash([12, 10]);
        ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.x + e.ax * 390, e.y + e.ay * 390); ctx.stroke();
        ctx.setLineDash([]);
      }
    }
    for (let i = 0; i < menuMoths.length; i += 2) glow('eyeR', menuMoths[i] + 4, menuMoths[i + 1], 3, 0.8);
    for (const s of stars) {
      const qq = s.t / 0.5, hx = s.x + 220 * qq, hy = s.y - 620 * qq;
      ctx.globalAlpha = 1;
      ctx.strokeStyle = `rgba(255,200,120,${0.25 + 0.4 * (1 - qq)})`; ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
      ctx.beginPath(); ctx.arc(s.x, s.y, s.R, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
      ctx.strokeStyle = 'rgba(255,230,170,.45)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(hx + 60, hy - 170); ctx.lineTo(hx, hy); ctx.stroke();
      glow('gold', hx, hy, 26, 1); glow('white', hx, hy, 6, 1);
    }
    for (const f of flashes) { const a = f.life / f.max; glow('gold', f.x, f.y, f.r * (1 - a * 0.3), a * 0.7); }
    for (const p of pulses) {
      const qq = 1 - p.life / p.max, r = p.R * (0.25 + 0.75 * (1 - (1 - qq) * (1 - qq)));
      ctx.globalAlpha = 1;
      ctx.strokeStyle = `rgba(255,200,120,${(1 - qq) * 0.8})`; ctx.lineWidth = 14 * (1 - qq) + 2;
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, TAU); ctx.stroke();
      glow('amber', p.x, p.y, r, (1 - qq) * 0.22);
    }
    for (const p of parts) if (!p.smoke && inView(p.x, p.y)) glow(p.g, p.x, p.y, p.r * 3, p.life / p.max);
    for (const m of motes) {
      const x = cx - 800 + ((((m.x + time * m.vx - cx + 800) % 1600) + 1600) % 1600);
      const y = cy - 800 + ((((m.y + time * m.vy - cy + 800) % 1600) + 1600) % 1600);
      glow('fire', x, y, 8, (0.5 + 0.5 * Math.sin(time * m.f + m.p)) * 0.45);
    }

    // Morgendämmerung
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (run && run.t > 400) {
      const a = Math.min(1, (run.t - 400) / 80) * 0.16 + (run.won ? Math.min(1, run.dawnT / 2) * 0.22 : 0);
      const gr = ctx.createLinearGradient(0, 0, 0, H);
      gr.addColorStop(0, `rgba(255,150,90,${a})`); gr.addColorStop(0.7, 'rgba(255,150,90,0)');
      ctx.globalAlpha = 1; ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
    }
    ctx.globalCompositeOperation = 'source-over';

    // Schadenszahlen in Bildschirm-Pixeln
    if (texts.length) {
      ctx.font = '700 15px "Barlow Semi Condensed", "Arial Narrow", sans-serif';
      ctx.textAlign = 'center'; ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(5,6,12,.85)'; ctx.fillStyle = '#fff1d6';
      for (const t of texts) {
        const sx = (t.x - cx) * zoom + W / 2, sy = (t.y - cy) * zoom + H / 2;
        ctx.globalAlpha = Math.min(1, t.life / 0.25);
        ctx.strokeText(t.v, sx, sy); ctx.fillText(t.v, sx, sy);
      }
    }
    // Daumen-Steuerung
    if (joy.active && state === 'play') {
      ctx.globalAlpha = 1;
      ctx.strokeStyle = 'rgba(239,230,207,.3)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(joy.ox, joy.oy, 56, 0, TAU); ctx.stroke();
      ctx.fillStyle = 'rgba(239,230,207,.35)';
      ctx.beginPath(); ctx.arc(joy.ox + joy.dx * 56, joy.oy + joy.dy * 56, 22, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ---------- Oberfläche ----------
  const elc = {};
  const E = id => elc[id] || (elc[id] = $(id));
  const txt = {};
  function setText(id, v) { if (txt[id] !== v) { txt[id] = v; E(id).textContent = v; } }

  function showScreen(id) {
    for (const s of ['menu', 'shop', 'lvl', 'pause', 'over']) E(s).hidden = s !== id;
    E('hud').hidden = !(state === 'play' || state === 'levelup' || state === 'pause');
  }
  let bannerTimer = 0;
  function banner(text, dur = 2.2) {
    const b = E('banner');
    b.textContent = text; b.classList.add('show');
    clearTimeout(bannerTimer);
    bannerTimer = setTimeout(() => b.classList.remove('show'), dur * 1000);
  }
  function updateHud() {
    if (!run) return;
    E('xpFill').style.width = ((run.xp / run.need) * 100).toFixed(1) + '%';
    E('hpFill').style.width = (Math.max(0, P.hp / P.maxHp) * 100).toFixed(1) + '%';
    setText('hpTxt', `${Math.ceil(Math.max(0, P.hp))} / ${P.maxHp}`);
    setText('lvTxt', tf('lvShort', { n: run.lv }));
    setText('clock', fmtClock(Math.min(run.t, RUN_LEN)));
    setText('killTxt', String(run.kills));
    setText('amberTxt', String(run.amber));
    const b = run.boss;
    if (b && !b.dead) {
      E('boss').hidden = false; setText('bossName', T('bossName'));
      E('bossFill').style.width = ((Math.max(0, b.hp) / b.max) * 100).toFixed(1) + '%';
    } else E('boss').hidden = true;
  }
  function updateInv() {
    const box = E('inv');
    box.innerHTML = '';
    if (!run) return;
    for (const id in run.items) {
      const it = ITEMS[id], s = document.createElement('span');
      if (it.kind === 'p') s.className = 'p';
      s.title = it.name[lang];
      s.innerHTML = icon(it.icon) + `<b>${run.items[id]}</b>`;
      box.appendChild(s);
    }
  }

  // Stufenaufstieg
  function rollChoices() {
    const pool = [];
    for (const id in ITEMS) {
      const lv = run.items[id] || 0;
      if (lv < ITEMS[id].max) pool.push({ id, w: lv > 0 ? 1.4 : ITEMS[id].kind === 'w' ? 1.1 : 1 });
    }
    const out = [];
    while (out.length < 3 && pool.length) {
      let r = Math.random() * pool.reduce((s, p) => s + p.w, 0), k = 0;
      while (k < pool.length - 1 && (r -= pool[k].w) > 0) k++;
      out.push(pool[k].id); pool.splice(k, 1);
    }
    if (!out.length) out.push('berries');
    return out;
  }
  function openLevelUp() {
    state = 'levelup'; joy.active = false;
    Snd.play('level');
    run.choices = rollChoices();
    renderCards();
    showScreen('lvl');
  }
  function renderCards() {
    const box = E('cards');
    box.innerHTML = '';
    setText('lvTitle', tf('lvTitle', { n: run.lv - run.pending + 1 }));
    run.choices.forEach((id, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      if (id === 'berries') {
        b.className = 'card pas locked';
        b.innerHTML = `${icon('berries')}<span class="c-body"><span class="c-name">${T('berriesName')}</span><span class="c-desc">${T('berriesDesc')}</span></span><kbd>${i + 1}</kbd>`;
      } else {
        const it = ITEMS[id], lv = run.items[id] || 0;
        const desc = it.kind === 'w' ? it.d[lang][lv] : it.d[lang];
        const line = lv ? `<span class="c-lv">${tf('lvLine', { a: lv, b: lv + 1 })}</span>` : `<span class="c-new">${T('isNew')}</span>`;
        b.className = 'card locked' + (it.kind === 'p' ? ' pas' : '');
        b.innerHTML = `${icon(it.icon)}<span class="c-body"><span class="c-name">${it.name[lang]}</span>${line}<span class="c-desc">${desc}</span></span><kbd>${i + 1}</kbd>`;
      }
      b.addEventListener('click', () => pick(id));
      box.appendChild(b);
    });
    const rb = E('rerollBtn');
    rb.hidden = run.rerolls <= 0;
    rb.textContent = tf('reroll', { n: run.rerolls });
    // kurze Sperre, damit ein Tipp vom Steuern nicht versehentlich wählt
    run.lvLock = performance.now() + 380;
    setTimeout(() => box.querySelectorAll('.card').forEach(c => c.classList.remove('locked')), 380);
  }
  function pick(id) {
    if (state !== 'levelup' || performance.now() < run.lvLock) return;
    if (id === 'berries') { P.hp = Math.min(P.maxHp, P.hp + 30); run.amber += 5; }
    else {
      run.items[id] = (run.items[id] || 0) + 1;
      recalc();
      if (id === 'cloak') P.hp = Math.min(P.maxHp, P.hp + 20);
    }
    run.pending--;
    Snd.play('click');
    updateInv();
    if (run.pending > 0) { run.choices = rollChoices(); renderCards(); }
    else { state = 'play'; showScreen(null); updateHud(); }
  }
  function reroll() {
    if (state !== 'levelup' || run.rerolls <= 0 || performance.now() < run.lvLock) return;
    run.rerolls--;
    run.choices = rollChoices();
    renderCards();
    Snd.play('click');
  }

  function pause() {
    if (state !== 'play') return;
    state = 'pause'; joy.active = false;
    for (const k in keys) keys[k] = false;
    showScreen('pause'); Platform.gameplayStop();
  }
  function resume() {
    if (state !== 'pause') return;
    state = 'play'; showScreen(null); Platform.gameplayStart();
  }

  function endRun(won) {
    state = 'over'; joy.active = false;
    Platform.gameplayStop();
    const t = Math.min(run.t, RUN_LEN), greed = 1 + 0.15 * (save.up.greed || 0);
    const drops = run.amber, timeB = Math.floor(t / 15), winB = won ? 40 : 0;
    const total = Math.round((drops + timeB + winB) * greed);
    const rec = t > save.best + 0.5;
    save.amber += total; save.runs++;
    if (won) save.wins++;
    if (t > save.best) save.best = t;
    persist();
    E('overTitle').textContent = T(won ? 'winTitle' : 'loseTitle');
    E('overSub').textContent = T(won ? 'winSub' : 'loseSub');
    E('stTime').textContent = fmtClock(t);
    E('stKills').textContent = run.kills;
    E('stLv').textContent = run.lv;
    const parts_ = [`${drops} ${T('bdDrops')}`, `${timeB} ${T('bdTime')}`];
    if (won) parts_.push(`${winB} ${T('bdWin')}`);
    if (greed > 1) parts_.push(`× ${greed.toFixed(2)}`);
    E('overEarn').innerHTML = `+${total} ${icon('amber')} <small>${parts_.join(' · ')}</small>`;
    E('overRec').hidden = !rec;
    showScreen('over');
    updateMenuMeta();
  }

  function toMenu() {
    run = null;
    enemies = []; shots = []; spores = []; gems = []; loot = []; parts = []; texts = []; pulses = []; stars = []; flashes = [];
    ff.length = 0; P.dead = false;
    recalc();
    state = 'menu'; showScreen('menu'); updateMenuMeta();
  }
  function openShop(from) { shopFrom = from; state = 'shop'; renderShop(); showScreen('shop'); }
  function closeShop() { state = shopFrom; showScreen(shopFrom); updateMenuMeta(); }

  function renderShop() {
    E('shopAmber').textContent = save.amber;
    const grid = E('shopGrid');
    grid.innerHTML = '';
    for (const m of META) {
      const lv = save.up[m.id] || 0, maxed = lv >= m.max, cost = maxed ? 0 : m.cost[lv];
      const el = document.createElement('div');
      el.className = 'up';
      el.innerHTML = `${icon(m.icon)}<div class="up-body"><h3>${m.name[lang]}</h3><p>${m.d[lang]}</p><span class="pips" aria-label="${lv} / ${m.max}">${'<i class="on"></i>'.repeat(lv)}${'<i></i>'.repeat(m.max - lv)}</span></div>`;
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'btn small buy'; b.id = 'buy-' + m.id;
      if (maxed) { b.textContent = T('maxed'); b.disabled = true; }
      else {
        b.innerHTML = `${cost}${icon('amber')}`;
        b.setAttribute('aria-label', `${T('buy')}: ${m.name[lang]}, ${cost} ${T('amber')}`);
        b.disabled = save.amber < cost;
        b.addEventListener('click', () => {
          if (save.amber < cost) return;
          save.amber -= cost; save.up[m.id] = lv + 1; persist();
          Snd.play('amber'); recalc(); renderShop(); updateMenuMeta();
          const nb = $('buy-' + m.id);
          if (nb && !nb.disabled) nb.focus();
        });
      }
      el.appendChild(b);
      grid.appendChild(el);
    }
  }

  function updateMenuMeta() {
    E('bestVal').textContent = save.best > 0 ? fmtClock(save.best) : T('noBest');
    E('winsVal').textContent = save.wins > 0 ? tf('wins', { n: save.wins }) : '';
    E('winsVal').hidden = save.wins <= 0;
    E('amberVal').textContent = save.amber;
  }
  function updateToggles() {
    const m = `${T('music')}: ${save.music ? T('on') : T('off')}`, s = `${T('sound')}: ${save.sfx ? T('on') : T('off')}`;
    for (const id of ['musBtn', 'musBtn2']) { E(id).textContent = m; E(id).setAttribute('aria-pressed', String(save.music)); }
    for (const id of ['sfxBtn', 'sfxBtn2']) { E(id).textContent = s; E(id).setAttribute('aria-pressed', String(save.sfx)); }
    E('langBtn').textContent = T('langBtn');
  }
  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-t]').forEach(el => { el.textContent = T(el.dataset.t); });
    updateToggles(); updateMenuMeta();
  }

  // ---------- Ereignisse ----------
  document.querySelectorAll('[data-ico]').forEach(el => el.insertAdjacentHTML('afterbegin', icon(el.dataset.ico)));
  const on = (id, fn) => E(id).addEventListener('click', () => { Snd.init(); Snd.play('click'); fn(); });
  on('playBtn', startRun);
  on('shopBtn', () => openShop('menu'));
  on('shopBack', closeShop);
  on('pauseBtn', pause);
  on('resumeBtn', resume);
  on('quitBtn', () => endRun(false));
  on('againBtn', () => Platform.breakAd(startRun));
  on('overShop', () => openShop('over'));
  on('overMenu', toMenu);
  on('rerollBtn', reroll);
  const toggleMusic = () => { save.music = !save.music; persist(); Snd.applyVolumes(); updateToggles(); };
  const toggleSfx = () => { save.sfx = !save.sfx; persist(); Snd.applyVolumes(); updateToggles(); };
  on('musBtn', toggleMusic); on('musBtn2', toggleMusic);
  on('sfxBtn', toggleSfx); on('sfxBtn2', toggleSfx);
  on('langBtn', () => { lang = lang === 'de' ? 'en' : 'de'; save.lang = lang; persist(); applyLang(); });

  // Ton erst nach der ersten Berührung (Browser-Regel)
  const firstGesture = () => { Snd.init(); Music.start(); };
  addEventListener('pointerdown', firstGesture, { once: true });
  addEventListener('keydown', firstGesture, { once: true });

  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (state === 'play' && k.startsWith('arrow')) e.preventDefault();
    keys[k] = true;
    if (k === 'escape' || k === 'p') { if (state === 'play') pause(); else if (state === 'pause') resume(); }
    if (state === 'levelup') {
      if (k >= '1' && k <= '3' && run.choices[+k - 1]) pick(run.choices[+k - 1]);
      if (k === 'r') reroll();
    }
  });
  addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
  addEventListener('blur', () => { for (const k in keys) keys[k] = false; pause(); });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { pause(); if (Snd.ctx) Snd.ctx.suspend().catch(() => {}); }
    else if (Snd.ctx) Snd.ctx.resume().catch(() => {});
  });

  cv.addEventListener('pointerdown', e => {
    if (state !== 'play') return;
    joy.active = true; joy.id = e.pointerId; joy.ox = e.clientX; joy.oy = e.clientY; joy.dx = joy.dy = 0;
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* egal */ }
  });
  cv.addEventListener('pointermove', e => {
    if (!joy.active || e.pointerId !== joy.id) return;
    const R = 56;
    let dx = e.clientX - joy.ox, dy = e.clientY - joy.oy;
    const d = Math.hypot(dx, dy);
    if (d > R) { joy.ox += dx * (1 - R / d); joy.oy += dy * (1 - R / d); dx = e.clientX - joy.ox; dy = e.clientY - joy.oy; }
    joy.dx = d < 6 ? 0 : dx / R; joy.dy = d < 6 ? 0 : dy / R;
  });
  const endJoy = e => { if (e.pointerId === joy.id) { joy.active = false; joy.dx = joy.dy = 0; } };
  cv.addEventListener('pointerup', endJoy);
  cv.addEventListener('pointercancel', endJoy);
  cv.addEventListener('contextmenu', e => e.preventDefault());
  addEventListener('resize', resize);

  // ---------- Hauptschleife ----------
  let last = performance.now(), slow = 0;
  function frame(now) {
    const raw = (now - last) / 1000;
    last = now;
    const dt = Math.min(0.05, raw);
    if (state === 'play' && !lowQ && (window.devicePixelRatio || 1) > 1) {
      slow = raw > 0.026 ? slow + 1 : Math.max(0, slow - 0.5);
      if (slow > 120) { lowQ = true; resize(); }
    }
    if (state === 'play') { for (let i = 0; i < dbg.speed && state === 'play'; i++) step(dt); }
    else if (!run) menuStep(dt);
    shakeAmt = Math.max(0, shakeAmt - dt * 22);
    render(now / 1000);
    requestAnimationFrame(frame);
  }

  function boot(data) {
    if (!storageOk && data && data.save) {
      save = Object.assign(defaultSave(), data.save);
      if (save.lang) lang = save.lang;
    }
    resize(); recalc(); applyLang(); showScreen('menu');
    requestAnimationFrame(t => { last = t; frame(t); });
  }
  try { window.claude?.hot?.snapshot?.(() => ({ save })); } catch (e) { /* nur im Artifact-Viewer */ }
  if (window.claude?.hot?.ready) window.claude.hot.ready(boot);
  else boot(window.claude?.hot?.data ?? {});

  window.__ln = {
    dbg, P, get state() { return state; }, get run() { return run; }, get enemies() { return enemies; }, get gems() { return gems; }, get spores() { return spores; },
    // Spielzeit ohne Animation vorspulen (für Tests); dbg.autoPick wählt bei Stufenaufstieg die erste Karte
    sim(sec) {
      for (let i = 0; i < sec * 60; i++) {
        if (state === 'levelup' && dbg.autoPick) { run.lvLock = 0; pick(typeof dbg.autoPick === 'function' ? dbg.autoPick(run.choices) : run.choices[0]); }
        if (state !== 'play') break;
        if (dbg.steer) dbg.steer();
        step(1 / 60);
      }
      render(performance.now() / 1000);
      return run && { state, t: Math.round(run.t), lv: run.lv, hp: Math.round(P.hp), kills: run.kills, en: enemies.length, items: { ...run.items } };
    },
  };
})();
</script>
</body>
</html>
