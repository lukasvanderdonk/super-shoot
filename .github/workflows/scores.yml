name: Bestenliste

# Die Spiele-App legt für neue Bestergebnisse ein Issue "score: <spiel>/<liste>" an.
# Dieser Ablauf trägt sie in scores/<spiel>.json ein und veröffentlicht die Dateien über GitHub Pages.
on:
  issues:
    types: [opened]
  workflow_dispatch:

# Immer nur ein Durchlauf gleichzeitig. Jeder Durchlauf arbeitet alle offenen score-Issues ab,
# darum geht nichts verloren, auch wenn ein wartender Durchlauf ersetzt wird.
concurrency:
  group: scores
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pages: write

jobs:
  scores:
    # Nur Issues vom Besitzer (der Schlüssel in der App gehört ihm) mit dem richtigen Titel
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'score:'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Einträge prüfen und eintragen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: node .github/scripts/process-scores.js

      - name: Veröffentlichen
        id: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scores
          if git diff --cached --quiet; then
            echo "Nichts Neues."
            exit 0
          fi
          git commit -m "Bestenliste aktualisiert"
          git pull --rebase origin main
          git push origin HEAD:main
          git push origin HEAD:gh-pages
          echo "pushed=1" >> "$GITHUB_OUTPUT"

      - name: GitHub Pages anstoßen
        if: steps.publish.outputs.pushed == '1'
        continue-on-error: true
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
